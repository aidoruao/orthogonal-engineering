    - V1460.registerBlockEntities (vanilla; mixin injects @RETURN)
    - V3818_3.lambda$registerTypes$0 (vanilla; mixin @ModifyArg)
    - ItemStackComponentizationFix.fixItemStack (vanilla; mixin injects @HEAD)

    DATA FLOW — CASE 1 (placed block entity)
    BROKEN:  World load → DFU → V1460.registerBlockEntities →
             [no FD entries] → Inventory.Items skipped → Count lost
    FIXED:   World load → DFU → V1460.registerBlockEntities →
             [V1460Mixin adds FD entries] → Inventory → Items →
             each ITEM_STACK converted by vanilla converter → Count preserved

    DATA FLOW — CASE 2 (cooking pot as item)
    BROKEN:  Cooking pot item processed by ItemStackComponentizationFix →
             BlockEntityTag.Inventory.Items[Slot 6] moved to farmersdelight:meal →
             raw old-format {Count: 16b, id: "minecraft:bread"} stored →
             DFU does not re-run ItemStackComponentizationFix on component →
             Count: 16b never converted → defaults to 1
    FIXED:   Same as above, but mixin explicitly converts:
             Count: 16b → count: 16 before calling setComponent →
             farmersdelight:meal = {count: 16, id: "minecraft:bread"}

    CRITICAL DETAIL — V3818_3 lambda method name:
    In NeoForge 1.21.1: method is "lambda$registerTypes$0" (anonymous lambda)
    In NeoForge 26.1+: method was renamed to "components"
    If the mixin fails to apply, use IntelliJ View > Show Bytecode to find the name.

    REFERENCE IMPLEMENTATIONS
    Patbox Brewery: https://github.com/Patbox/brewery/tree/main/src/main/java/eu/pb4/brewery/mixin/datafixer
    vectorwing WIP (3 files already exist): https://github.com/vectorwing/FarmersDelight/tree/dev-1.21.1/1.3

  the_math: |
    CASE 1 — Block entity (placed in world)

    Let c ∈ ℤ be the item count in a Cooking Pot before upgrade.
    Let F: WorldState → WorldState be the data fixer.

    WITHOUT V1460Mixin:
      F does not traverse Inventory.Items for farmersdelight:cooking_pot.
      Count field absent after conversion → Minecraft default: c' = 1
      Data loss: c' ≠ c for all c ≠ 1.

    WITH V1460Mixin:
      F traverses Inventory → Items → [ITEM_STACK_1, ..., ITEM_STACK_n].
      For each ITEM_STACK_i: vanilla converter maps Count: TAG_Byte(c_i) → count: c_i.
      c_i' = c_i (identity). No arithmetic transformation. No float. c ∈ ℤ throughout.

    CASE 2 — Cooking Pot as item (stored in chest/inventory)

    Let m ∈ ℤ be the meal count in the Cooking Pot item before upgrade.
    Old NBT format: {Count: m_b, id: "minecraft:bread"} where m_b is TAG_Byte.
    New format expected by 1.21: {count: m_i, id: "minecraft:bread"} where m_i is TAG_Int.

    WITHOUT Count fix in ItemStackComponentizationFixMixin:
      setComponent("farmersdelight:meal", {Count: m_b, id: ...})
      DFU does not re-run ItemStackComponentizationFix on the component.
      Count: m_b not converted → Minecraft reads absent count → m' = 1 (default).
      Data loss: m' = 1 for all m ≠ 1.

    WITH Count fix:
      count = (int) m_b    [lossless integer promotion; m_b ∈ [1, 127] ⊂ ℤ]
      setComponent("farmersdelight:meal", {count: count, id: ...})
      m' = count = m  (identity). No float. No precision loss. m ∈ ℤ throughout.

    Special case: if m = 1, the count field is omitted (Minecraft convention).
    Minecraft reads absent count as 1, so m' = 1 = m (identity preserved).

  the_code: |
    // ═══════════════════════════════════════════════════════════════════════════
    // FILE 1: V1460Mixin.java — registers FD block entities in DFU
    // PATH: src/main/java/vectorwing/farmersdelight/common/mixin/V1460Mixin.java
    // ═══════════════════════════════════════════════════════════════════════════

    package vectorwing.farmersdelight.common.mixin;

    import com.mojang.datafixers.DSL;
    import com.mojang.datafixers.schemas.Schema;
    import com.mojang.datafixers.types.templates.TypeTemplate;
    import net.minecraft.util.datafix.fixes.References;
    import net.minecraft.util.datafix.schemas.V1460;
    import org.spongepowered.asm.mixin.Mixin;
    import org.spongepowered.asm.mixin.Shadow;
    import org.spongepowered.asm.mixin.Unique;
    import org.spongepowered.asm.mixin.injection.At;
    import org.spongepowered.asm.mixin.injection.Inject;
    import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
    import vectorwing.farmersdelight.FarmersDelight;

    import java.util.Map;
    import java.util.function.Supplier;

    @Mixin(V1460.class)
    public abstract class V1460Mixin extends Schema
    {
        @Shadow
        protected static void registerInventory(Schema schema, Map<String, Supplier<TypeTemplate>> map, String name) {}

        public V1460Mixin(int versionKey, Schema parent) {
            super(versionKey, parent);
        }

        @Inject(method = "registerBlockEntities", at = @At("RETURN"))
        private void registerFarmersDelightBlockEntities(Schema schema, CallbackInfoReturnable<Map<String, Supplier<TypeTemplate>>> cir) {
            var map = cir.getReturnValue();

            farmersdelight$registerHandlerInventory(schema, map, farmersdelight$id("stove"));
            farmersdelight$registerHandlerInventory(schema, map, farmersdelight$id("cutting_board"));
            farmersdelight$registerHandlerInventory(schema, map, farmersdelight$id("skillet"));

            schema.register(map, farmersdelight$id("cooking_pot"), p_17586_ ->
                    DSL.optionalFields(
                            "Inventory", DSL.optionalFields("Items", DSL.list(References.ITEM_STACK.in(schema))),
                            "Container", References.ITEM_STACK.in(schema)
                    ));

            registerInventory(schema, map, farmersdelight$id("cabinet"));
            registerInventory(schema, map, farmersdelight$id("basket"));
        }

        @Unique
        private static String farmersdelight$id(String path) {
            return FarmersDelight.MODID + ":" + path;
        }

        @Unique
        private static void farmersdelight$registerHandlerInventory(Schema schema, Map<String, Supplier<TypeTemplate>> map, String name) {
            schema.register(map, name, string ->
                    DSL.optionalFields("Inventory", DSL.optionalFields("Items", DSL.list(References.ITEM_STACK.in(schema)))));
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // FILE 2: V3818_3Mixin.java — registers farmersdelight:meal/container component types
    // PATH: src/main/java/vectorwing/farmersdelight/common/mixin/V3818_3Mixin.java
    // ═══════════════════════════════════════════════════════════════════════════

    package vectorwing.farmersdelight.common.mixin;

    import com.llamalad7.mixinextras.sugar.Local;
    import com.mojang.datafixers.schemas.Schema;
    import com.mojang.datafixers.types.templates.TypeTemplate;
    import com.mojang.datafixers.util.Pair;
    import net.minecraft.util.datafix.fixes.References;
    import net.minecraft.util.datafix.schemas.V3818_3;
    import org.spongepowered.asm.mixin.Mixin;
    import org.spongepowered.asm.mixin.injection.At;
    import org.spongepowered.asm.mixin.injection.ModifyArg;

    import java.util.ArrayList;
    import java.util.List;

    @Mixin(V3818_3.class)
    public class V3818_3Mixin
    {
        @ModifyArg(method = "lambda$registerTypes$0", at = @At(value = "INVOKE",
                target = "Lcom/mojang/datafixers/DSL;optionalFields([Lcom/mojang/datafixers/util/Pair;)Lcom/mojang/datafixers/types/templates/TypeTemplate;"))
        private static Pair<String, TypeTemplate>[] addFDCustomComponents(
                Pair<String, TypeTemplate>[] components, @Local(argsOnly = true) Schema schema) {
            var list = new ArrayList<>(List.of(components));
            list.add(Pair.of("farmersdelight:meal", References.ITEM_STACK.in(schema)));
            list.add(Pair.of("farmersdelight:container", References.ITEM_STACK.in(schema)));
            return list.toArray(components);
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // FILE 3: ItemStackComponentizationFixMixin.java — fixes Cooking Pot item Count
    // PATH: src/main/java/vectorwing/farmersdelight/common/mixin/ItemStackComponentizationFixMixin.java
    //
    // KEY FIX: The original WIP code had "NOT WORKING?" on the Count conversion.
    // The bug: setComponent() with raw old-format NBT does not trigger recursive
    // DFU processing. Count: TAG_Byte must be manually renamed to count: TAG_Int.
    // ═══════════════════════════════════════════════════════════════════════════

    package vectorwing.farmersdelight.common.mixin;

    import com.mojang.serialization.Dynamic;
    import net.minecraft.util.datafix.fixes.ItemStackComponentizationFix;
    import org.spongepowered.asm.mixin.Mixin;
    import org.spongepowered.asm.mixin.injection.At;
    import org.spongepowered.asm.mixin.injection.Inject;
    import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

    import java.util.List;

    @SuppressWarnings({"rawtypes"})
    @Mixin(ItemStackComponentizationFix.class)
    public class ItemStackComponentizationFixMixin
    {
        @Inject(method = "fixItemStack", at = @At("HEAD"))
        private static void fixCustomStacks(ItemStackComponentizationFix.ItemStackData data, Dynamic tag, CallbackInfo ci) {
            if (data.is("farmersdelight:cooking_pot")) {
                data.fixSubTag("BlockEntityTag", false, subTag -> {
                    data.setComponent("farmersdelight:container", subTag.get("Container"));

                    List<Dynamic<?>> items = subTag.get("Inventory").get("Items")
                            .asList(itemTag -> {
                                int count = itemTag.get("Count").asNumber(1).result()
                                        .map(Number::intValue).orElse(1);
                                Dynamic<?> converted = itemTag.remove("Slot").remove("Count");
                                if (count > 1) {
                                    converted = converted.set("count", converted.createInt(count));
                                }
                                return converted;
                            });
                    if (!items.isEmpty()) {
                        data.setComponent("farmersdelight:meal", items.getFirst());
                    }
                    return subTag.remove("Container").remove("Inventory");
                });
                data.removeTag("BlockEntityTag");
            }
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // farmersdelight.mixins.json — add to "mixins" array
    // ═══════════════════════════════════════════════════════════════════════════
    // "ItemStackComponentizationFixMixin",
    // "V1460Mixin",
    // "V3818_3Mixin",

  falsification_conditions: |
    FALSIFICATION CONDITIONS (how to disprove the fix works)

    1. BLOCK ENTITY — COUNT (tests V1460Mixin, primary fix):
       In MC 1.20.1: place a Cooking Pot. Put 64 bread in an ingredient slot.
       Upgrade to MC 1.21. Open the Cooking Pot.
       FIX FAILS if: bread count is 1 instead of 64.

    2. BLOCK ENTITY — ALL FD ENTITIES (tests V1460Mixin completeness):
       In MC 1.20.1: fill a Cabinet with 64-stacks of items. Upgrade to 1.21.
       FIX FAILS if: any Cabinet slot shows count = 1.

    3. COOKING POT AS ITEM — COUNT (tests ItemStackComponentizationFix Count fix):
       In MC 1.20.1: use Carry On to pick up a Cooking Pot with 16 meal servings.
       Store the Cooking Pot item in a chest. Upgrade to 1.21. Open the chest.
       Take out the Cooking Pot. Check meal servings.
       FIX FAILS if: meal count is 1 instead of 16.
       (This is the original "NOT WORKING?" bug in the WIP code.)

    4. REGRESSION — EXISTING 1.21 WORLDS:
       Open an existing 1.21 world with placed Cooking Pots containing items.
       FIX FAILS if: any item count in an existing 1.21 Cooking Pot changes.

    5. REGRESSION — FRESH 1.21 WORLD:
       Create a fresh 1.21 world. Place a Cooking Pot. Put 32 carrots in it.
       Save and reload the world.
       FIX FAILS if: carrot count changes on reload.

    6. ONTOLOGICAL PARADOX FALSIFICATION (V1460 alone is insufficient):
       Apply ONLY V1460Mixin (no V3818_3, no ItemStackComponentizationFix).
       Repeat test 3 (Cooking Pot as item with 16 servings).
       EXPECTED: meal count is still 1 — proving V1460 alone is not sufficient.
       This CONFIRMS the need for all three mixin files.

