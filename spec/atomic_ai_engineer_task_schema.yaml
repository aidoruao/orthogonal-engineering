    patch_item_stack_fix: |
      package vectorwing.farmersdelight.common.mixin;

      import com.mojang.serialization.Dynamic;
      import net.minecraft.util.datafix.fixes.ItemStackComponentizationFix;
      import org.spongepowered.asm.mixin.Mixin;
      import org.spongepowered.asm.mixin.injection.At;
      import org.spongepowered.asm.mixin.injection.Inject;
      import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

      import java.util.List;

      @SuppressWarnings({"rawtypes"})
      @Mixin(ItemStackComponentizationFix.class)
      public class ItemStackComponentizationFixMixin
      {
          @Inject(method = "fixItemStack", at = @At("HEAD"))
          private static void fixCustomStacks(ItemStackComponentizationFix.ItemStackData data, Dynamic tag, CallbackInfo ci) {
              if (data.is("farmersdelight:cooking_pot")) {
                  data.fixSubTag("BlockEntityTag", false, subTag -> {
                      // Container: count is always 1 for bowl/bottle containers
                      data.setComponent("farmersdelight:container", subTag.get("Container"));

                      // Meal: manually convert Count (old TAG_Byte) to count (new TAG_Int).
                      // The DFU does NOT re-run ItemStackComponentizationFix on components
                      // that are set inside fixItemStack — the Count would be silently dropped
                      // (reset to 1) without this explicit conversion.
                      List<Dynamic<?>> items = subTag.get("Inventory").get("Items")
                              .asList(itemTag -> {
                                  int count = itemTag.get("Count").asNumber(1).result()
                                          .map(Number::intValue).orElse(1);
                                  Dynamic<?> converted = itemTag.remove("Slot").remove("Count");
                                  if (count > 1) {
                                      converted = converted.set("count", converted.createInt(count));
                                  }
                                  return converted;
                              });
                      if (!items.isEmpty()) {
                          data.setComponent("farmersdelight:meal", items.getFirst());
                      }
                      return subTag.remove("Container").remove("Inventory");
                  });
                  data.removeTag("BlockEntityTag");
              }
          }
      }
