    ---

    ## Math / Data Integrity

    **Block entity case (V1460Mixin):**
    Let `c ∈ ℤ` be the item count in a placed Cooking Pot. The data fixer
    is `F: WorldState → WorldState`. Without fix: `F` skips `Inventory.Items`,
    `Count` field absent → Minecraft defaults `c' = 1` (data loss).
    With fix: `F` traverses `Inventory → Items → ITEM_STACK` for each item,
    vanilla converter maps `Count: TAG_Byte(c) → count: c`, so `c' = c` (identity).

    **Item case (ItemStackComponentizationFixMixin):**
    The old format stores count as `Count: TAG_Byte(c)`. In new format, count
    is `count: TAG_Int(c)`. Since the DFU does not recursively apply
    `ItemStackComponentizationFix` to custom components set inside `fixItemStack`,
    the conversion `Count: c_b → count: c_i` must be performed explicitly:
    `c_i = (int) c_b` — a lossless integer promotion. No floating-point arithmetic.
    Count remains in `ℤ` throughout. For `c = 1` (default), the field is omitted
    (Minecraft interprets absent count as 1).

    ---

    ## How to Verify

    **Block entity case (V1460Mixin):**
    1. Create a Minecraft 1.20.1 world with Farmer's Delight installed.
    2. Place a Cooking Pot. Put a stack of 64 bread in it. Fill 3 ingredient slots.
    3. Save and close the world.
    4. Open the world in Minecraft 1.21 with this build. Open the Cooking Pot.
    5. **Expected:** 64 bread present, ingredient slots populated.
    6. **FAIL:** Count resets to 1 — V1460Mixin not applied or DSL.list() missing.

    **Item case (ItemStackComponentizationFixMixin Count fix):**
    1. In 1.20.1, use Carry On (or similar) to pick up a Cooking Pot with 16 meal servings.
    2. Store the cooking pot item in a chest. Save and close.
    3. Open the world in 1.21. Open the chest. Take out the Cooking Pot. Check meal count.
    4. **Expected:** Meal shows 16 servings.
    5. **FAIL:** Meal count is 1 — the explicit Count conversion in ItemStackComponentizationFixMixin
       is missing or incorrect.

    **Regression (no corruption of existing 1.21 worlds):**
    - Open a 1.21 world with existing Cooking Pots. Verify no item count changes.
    - Create a fresh 1.21 Cooking Pot. Put 32 carrots in it. Reload. Verify count unchanged.

    ---

