  the_math: |
    Let c ∈ ℤ be the item count (stack size) stored in a Cooking Pot before
    world upgrade. The data fixer is a function F: WorldState → WorldState.

    WITHOUT FIX:
      F(cooking_pot_inventory) = {} (empty; Inventory.Items path not traversed)
      Result: Count field absent → Minecraft defaults Count to 1
      c' = 1  for all c ≠ 1  (data loss)

    WITH FIX:
      F(cooking_pot_inventory) = convert(Inventory.Items, ITEM_STACK_schema)
      The vanilla ITEM_STACK converter maps Count: TAG_Int(c) → count: c
      c' = c  (identity; no arithmetic transformation)

    The fix performs NO arithmetic on c. It only registers the traversal path
    so the vanilla converter can reach and migrate the Count field.
    There is no floating-point arithmetic. Count remains in ℤ throughout.

    Formally, the registration call:
      schema.register(map, "farmersdelight:cooking_pot", string ->
          DSL.optionalFields("Inventory",
              DSL.optionalFields("Items",
                  DSL.list(References.ITEM_STACK.in(schema)))))

    defines a type-template T such that for any Cooking Pot block entity D:
      T(D).Inventory.Items[i] is typed as ITEM_STACK
    This allows F to apply the ITEM_STACK conversion rule to each item i,
    preserving Count, id, tag, and all other fields.

