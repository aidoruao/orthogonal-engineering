       Cooking Pot in MC 1.20.1. Upgrade to MC 1.21. Open the Cooking Pot.
       FIX FAILS if: enchantment is absent or item reverts to unenchanted.

    3. Open an existing 1.21 world that already has a Cooking Pot (no upgrade
       needed). Apply this mod build.
       FIX FAILS if: any existing 1.21 Cooking Pot inventory is corrupted
       (item count changes, items disappear, or items duplicate).

    4. Create a Cooking Pot in a fresh 1.21 world (no upgrade). Put 32 carrots
       in it. Save and reload.
       FIX FAILS if: carrot count changes on reload (the fix must be no-op for
       worlds that were already on 1.21 and never needed data migration).
