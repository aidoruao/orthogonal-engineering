  pr_body: |
    ## Problem

    When upgrading a world from Minecraft 1.20.1 to 1.21+, items stored inside
    Farmer's Delight block entities (Cooking Pot, Cabinets, Baskets, Stove,
    Cutting Board, Skillet) lose their **stack size** (Count resets to 1) and
    other NBT data. Additionally, a Cooking Pot stored as an **item** (e.g., in
    a chest or player inventory) loses its meal's stack count on upgrade.

    Reported in: https://github.com/vectorwing/FarmersDelight/issues/1262

    ---

    ## Root Cause — Two Separate Issues

    ### Issue 1: Placed block entities (world upgrade — most common)

    Minecraft 1.21 migrated item data storage from NBT to **Data Components**.
    This migration is performed by `DataFixerUpper`, which must explicitly know
    every block entity type that contains items. This is registered in `V1460`
    (Minecraft's data fixer schema for block entities, introduced in 1.13).

    Farmer's Delight uses NeoForge's `ItemStackHandler` to store items, which
    wraps them in an extra `Inventory` NBT layer:

        BlockEntityTag → Inventory → Items → [list of ITEM_STACK]

    None of the FD block entities were registered in the DFU, so the fixer
    never traverses into `Inventory.Items`. All item data, including `Count`,
    is silently dropped.

    ### Issue 2: Cooking Pot stored as an item (edge case)

    When a Cooking Pot is stored as an item (e.g., picked up by Carry On or
    similar mods), its meal and container are stored in `BlockEntityTag`.
    `ItemStackComponentizationFix` must move this data to the new component
    format (`farmersdelight:meal`, `farmersdelight:container`). However, the
    DFU **does not** re-run `ItemStackComponentizationFix` on components set
    inside `fixItemStack`, so the `Count` field (`TAG_Byte Count`) is not
    automatically converted to the new `int count` format — it defaults to 1.

    ---

    ## Causal Chain

    **Block entity case:**
    1. Minecraft 1.21 replaces NBT item storage with Data Components.
    2. DFU runs `V1460.registerBlockEntities()` on world load.
    3. Only block entities explicitly registered are recursed into.
    4. FD block entities not registered → `Inventory.Items` skipped → `Count` lost.

    **Item case (Cooking Pot as item):**
    1. `ItemStackComponentizationFix.fixItemStack()` processes the Cooking Pot item.
    2. Meal item is moved from `BlockEntityTag.Inventory.Items` to `farmersdelight:meal`.
    3. The moved item is raw old-format NBT: `{Count: 16b, id: "minecraft:bread"}`.
    4. DFU does not re-run `ItemStackComponentizationFix` on the newly-set component.
    5. `Count: 16b` (byte) is never converted to `count: 16` (int) → defaults to 1.

    ---

    ## Fix — Three Mixin Files

    Patbox confirmed the three required classes in this thread:
    https://github.com/vectorwing/FarmersDelight/issues/1262#issuecomment-4160029492

    Reference implementations: https://github.com/Patbox/brewery/tree/main/src/main/java/eu/pb4/brewery/mixin/datafixer

    ### File 1 — `V1460Mixin.java` (fixes placed block entities)

    ```java
    package vectorwing.farmersdelight.common.mixin;

    import com.mojang.datafixers.DSL;
    import com.mojang.datafixers.schemas.Schema;
    import com.mojang.datafixers.types.templates.TypeTemplate;
    import net.minecraft.util.datafix.fixes.References;
    import net.minecraft.util.datafix.schemas.V1460;
    import org.spongepowered.asm.mixin.Mixin;
    import org.spongepowered.asm.mixin.Shadow;
    import org.spongepowered.asm.mixin.Unique;
    import org.spongepowered.asm.mixin.injection.At;
    import org.spongepowered.asm.mixin.injection.Inject;
    import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
    import vectorwing.farmersdelight.FarmersDelight;

    import java.util.Map;
    import java.util.function.Supplier;

    @Mixin(V1460.class)
    public abstract class V1460Mixin extends Schema
    {
        @Shadow
        protected static void registerInventory(Schema schema, Map<String, Supplier<TypeTemplate>> map, String name) {}

        public V1460Mixin(int versionKey, Schema parent) {
            super(versionKey, parent);
        }

        @Inject(method = "registerBlockEntities", at = @At("RETURN"))
        private void registerFarmersDelightBlockEntities(Schema schema, CallbackInfoReturnable<Map<String, Supplier<TypeTemplate>>> cir) {
            var map = cir.getReturnValue();

            // Workstations: items in Inventory.Items (ItemStackHandler adds the Inventory wrapper)
            farmersdelight$registerHandlerInventory(schema, map, farmersdelight$id("stove"));
            farmersdelight$registerHandlerInventory(schema, map, farmersdelight$id("cutting_board"));
            farmersdelight$registerHandlerInventory(schema, map, farmersdelight$id("skillet"));

            // Cooking Pot: nested Inventory.Items + separate Container ITEM_STACK
            schema.register(map, farmersdelight$id("cooking_pot"), p_17586_ ->
                    DSL.optionalFields(
                            "Inventory", DSL.optionalFields("Items", DSL.list(References.ITEM_STACK.in(schema))),
                            "Container", References.ITEM_STACK.in(schema)
                    ));

            // Storage blocks: flat Items list — vanilla registerInventory works
            registerInventory(schema, map, farmersdelight$id("cabinet"));
            registerInventory(schema, map, farmersdelight$id("basket"));
        }

        @Unique
        private static String farmersdelight$id(String path) {
            return FarmersDelight.MODID + ":" + path;
        }

        @Unique
        private static void farmersdelight$registerHandlerInventory(Schema schema, Map<String, Supplier<TypeTemplate>> map, String name) {
            schema.register(map, name, string ->
                    DSL.optionalFields("Inventory", DSL.optionalFields("Items", DSL.list(References.ITEM_STACK.in(schema)))));
        }
    }
    ```

