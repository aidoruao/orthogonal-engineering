    step_4: "Compare against expected_results"
    step_5: "If all AIs agree with expected_results -- fix is externally verified"
    step_6: "If any AI disagrees -- investigate the disagreement"
    step_7: "Record results in verification_report.json"

    pass_condition: "All 6 answers match expected_results across >= 3 models"
    fail_condition: "Any answer differs AND the differing AI provides a valid derivation"

