cross_model_verification:
  schema_id: "XMODEL-FD-001"
  version: "1.0.0"
  domain: "D_CROSS_MODEL_BENCHMARKS"
  invariant: "Same formal problem produces same proof object regardless of model"
  yeshua_axiom_4: "No authority without proof — no AI's agreement counts without derivation"
  yeshua_axiom_2: "Every derivation is reproducible — any AI re-deriving must get same result"

  # ---------------------------------------------------------------------------
  # SECTION 1: DETERMINISTIC FACT SET
  # These are verifiable facts from public GitHub. Any AI can check them.
  # ---------------------------------------------------------------------------
  deterministic_facts:
    - id: "FACT-001"
      claim: "Minecraft 1.21 replaced NBT item storage with Data Components"
      source: "https://minecraft.wiki/w/Data_component_format"
      verification: "Check Minecraft wiki or any 1.21 changelog"
      falsifies_if: "Minecraft 1.21 still uses NBT for item storage"

    - id: "FACT-002"
      claim: "Schema1460 (V1460) defines block entity type templates for the DFU"
      source: "net.minecraft.util.datafix.schemas.V1460 (decompiled MC source)"
      verification: "Decompile MC 1.21.1 jar, read V1460.registerBlockEntities()"
      falsifies_if: "V1460 does not contain registerBlockEntities method"

    - id: "FACT-003"
      claim: "Farmer's Delight Cooking Pot stores items at path Inventory.Items"
      source: "https://github.com/vectorwing/FarmersDelight (CookingPotBlockEntity.java)"
      verification: "Clone repo, grep for 'Inventory' in CookingPotBlockEntity"
      falsifies_if: "Cooking Pot stores items at a different NBT path"

    - id: "FACT-004"
      claim: "vectorwing confirmed V1460 mixin alone does NOT fix Count for Cooking Pot"
      source: "https://github.com/vectorwing/FarmersDelight/issues/1262"
      verification: "Read vectorwing's comment from April 2026"
      exact_quote: >
        "While it manages to cross over the meal and container stacks,
