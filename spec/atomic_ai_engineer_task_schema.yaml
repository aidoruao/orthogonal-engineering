# spec/atomic_ai_engineer_task_schema.yaml
# PR #90 — Atomic AI Engineers Task Schema
# Standard: Yeshua
# Version: 1.0.0
# Authority: Orthogonal Engineering Framework
#
# Purpose: Define the canonical schema for AI agents to autonomously
# diagnose, fix, verify, and submit patches to external open-source
# repositories, with every step enforced by the OE warden stack.
#
# Test case: Farmer's Delight #135 / #1262
#   (NBT → Data Component migration for Cooking Pot stack sizes)

metadata:
  schema_id: "ATOMIC-AI-ENGINEER-TASK-1.0"
  schema_version: "1.0.0"
  standard: "Yeshua"
  pr: 90
  created: "2026-04-04"
  authority: "Orthogonal Engineering Framework"
  global_mode: "execute"  # PR #89 — wardens actively enforce
  depends_on:
    - "yeshua/axioms/eight_axioms.json"
    - "YESHUA_SYSTEM_SCHEMA.yaml"
    - "resilience/invariant_spec_v2.freeze"
    - "wardens/seraph_unit.py"
    - "wardens/ophanim_unit.py"
    - "wardens/cherub_unit.py"
    - "yeshua_math/peano_invariant_checker.py"

# =============================================================================
# TASK DEFINITION — What the AI agent must produce
# =============================================================================
task_definition:
  required_fields:
    - field: "task_id"
      type: "string"
      format: "TASK-YYYY-MM-DD-NNN"
      description: "Unique task identifier with date prefix"
      yeshua_axiom: 8  # Every artifact is hash-anchored

    - field: "issue_url"
      type: "string"
      format: "https://github.com/{owner}/{repo}/issues/{number}"
      description: "GitHub issue URL for the upstream bug"
      yeshua_axiom: 4  # No authority without proof

    - field: "target_repository"
      type: "string"
      format: "https://github.com/{owner}/{repo}"
      description: "External repository where the fix will be submitted"

    - field: "ontological_diagnosis"
      type: "object"
      description: "Root cause explanation at the architectural level"
      properties:
        root_cause:
          type: "string"
          description: "Why the bug exists (architectural reason)"
        assumption_violated:
          type: "string"
          description: "What assumption the original code made that is now false"
        causal_chain:
          type: "array"
          items: "string"
          description: "Ordered list of causal steps from root cause to symptom"
      falsifies_if: "Root cause does not explain the observed symptom"

    - field: "technical_diagnosis"
      type: "object"
      description: "Code-level problem identification"
      properties:
        affected_files:
          type: "array"
          items: "string"
          description: "File paths in the target repo that need changes"
        affected_functions:
          type: "array"
          items: "string"
          description: "Function/method names that contain the bug"
        data_flow:
          type: "string"
          description: "How data moves through the broken path"
        reference_implementation:
          type: "string"
          format: "URL"
          description: "Link to working code that demonstrates the fix pattern"
      falsifies_if: "Identified functions do not participate in the broken data flow"

    - field: "code_fix"
      type: "object"
      description: "The actual patch"
      properties:
        patch_format:
          type: "string"
          enum: ["unified_diff", "file_changes"]
        files_changed:
          type: "array"
          items:
            type: "object"
            properties:
              path: { type: "string" }
              additions: { type: "integer", minimum: 0 }
              deletions: { type: "integer", minimum: 0 }
              diff: { type: "string" }
        build_verified:
          type: "boolean"
          description: "Agent confirmed the target project builds with the fix"
        tests_pass:
          type: "boolean"
          description: "Agent confirmed existing tests still pass"
      falsifies_if: "Patch does not compile or breaks existing tests"

    - field: "falsification_conditions"
      type: "array"
      items: "string"
      min_items: 1
      description: >
        How to disprove the fix works. At least one condition required.
        Each condition must be testable by running the target project.
      yeshua_axiom: 1  # Every truth is derivable

# =============================================================================
# VERIFICATION REQUIREMENTS — Warden checks that MUST pass
# =============================================================================
# These map directly to the actual warden unit interfaces.
# With global_mode: "execute", these are blocking gates.
verification_requirements:

  seraph_audit:
    description: "SeraphUnit logic audit on the generated patch"
    warden: "wardens/seraph_unit.py"
    class: "SeraphUnit"
    method: "query('scan')"
    required_checks:
      - check: "logic_audit"
        gate: "finding_count == 0 for categories [tautological_condition, unreachable_code, missing_return_path]"
        description: "No tautologies, unreachable code, or missing return paths in the fix"
      - check: "redundancy_detection"
        gate: "finding_count == 0"
        description: "No duplicate logic blocks introduced by the fix"
      - check: "hallucination_scan"
        gate: "finding_count == 0"
        description: "No meta-mimicry compliance-theater patterns in the fix"
    determinism_requirement: "analysis_hash must be identical across two consecutive scans"
    falsifies_if: "SeraphUnit.query('scan') returns finding_count > 0 for any gated category"

  ophanim_cycle_check:
    description: "OphanimUnit cycle and entropy check on the fix"
    warden: "wardens/ophanim_unit.py"
    class: "OphanimUnit"
    method: "query('scan')"
    required_checks:
      - check: "cycle_detection"
        gate: "dag_acyclic == true"
        invariant: "INV-GLOBAL-006 DAG_CONSISTENCY"
        description: "Fix does not introduce import cycles"
      - check: "entropy_monitoring"
        gate: "finding_count == 0"
        invariant: "ATOMIC-AFFECTIVE-005"
        description: "No feedback amplification patterns in logs"
      - check: "growth_analysis"
        gate: "growth_ratio <= 2.0 or growth_ratio is null"
        description: "No abnormal log growth spike from the fix"
    determinism_requirement: "analysis_hash must be identical across two consecutive scans"
    falsifies_if: "OphanimUnit.query('scan') returns dag_acyclic == false or entropy finding_count > 0"

  cherub_documentation:
    description: "CherubUnit boundary guard on fix documentation"
    warden: "wardens/cherub_unit.py"
    class: "CherubUnit"
    method: "query('scan')"
    required_checks:
      - check: "source_verification"
        gate: "All claims in PR description have verifiable sources"
        description: "No unverifiable 'studies show' or 'experts say' claims"
      - check: "timestamp_validation"
        gate: "All generated documents contain ISO 8601 timestamps"
        description: "Every artifact has explicit timestamp metadata"
      - check: "pii_boundary_check"
        gate: "finding_count == 0 for severity in [critical, high]"
        description: "No PII violations in the fix or its documentation"
    falsifies_if: "CherubUnit.query('scan') returns critical or high PII violations"

  peano_invariant_check:
    description: "Peano arithmetic invariant check on any numeric logic in the fix"
    checker: "yeshua_math/peano_invariant_checker.py"
    function: "run_peano_invariant_checker()"
    gate: "report.all_passed == true"
    applies_when: "Fix modifies arithmetic or numeric stack-size logic"
    description_detail: >
      For the Farmer's Delight case: the Cooking Pot stores item Count
      as an integer. The data fixer must preserve Count values exactly.
      No unbounded float literals or float() constructors in the fix.
    falsifies_if: "PeanoInvariantReport.all_passed == false"

# =============================================================================
# PROOF BUNDLE — Cryptographic verification of the fix
# =============================================================================
proof_bundle:
  description: "Cryptographic proof that the fix is verified and reproducible"
  schema_reference: ".github/workflows/pr39-peano-sovereignty.yml"
  required_fields:
    - field: "task_id"
      type: "string"
    - field: "environment_hash"
      type: "string"
      format: "sha256"
      description: "SHA-256 of os|python_version|seed"
    - field: "merkle_root"
      type: "string"
      format: "sha256"
      description: "Merkle root over SHA-256 hashes of all fix artifacts"
    - field: "output_hash"
      type: "string"
      format: "sha256"
      description: "SHA-256 of task_id|merkle_root"
    - field: "timestamp"
      type: "string"
      format: "ISO 8601"
    - field: "warden_results"
      type: "object"
      properties:
        seraph_hash: { type: "string", format: "sha256" }
        ophanim_hash: { type: "string", format: "sha256" }
        cherub_hash: { type: "string", format: "sha256" }
        peano_passed: { type: "boolean" }
    - field: "node_id"
      type: "string"
      description: "Identifier of the CI node that produced this bundle"
  cross_node_parity: >
    If multiple nodes produce bundles, all merkle_root values must be
    identical. This is the same parity check used in pr39-peano-sovereignty.yml.
  falsifies_if: "Two nodes produce different merkle_root values for the same fix"

# =============================================================================
# YESHUA COMPLIANCE — Every task must satisfy all 8 axioms
# =============================================================================
yeshua_compliance:
  axioms_file: "yeshua/axioms/eight_axioms.json"
  enforcement: "Each task artifact is wrapped in a YeshuaClaim and verified"
  axiom_mapping:
    1_derivable: "ontological_diagnosis.causal_chain traces from root cause to symptom"
    2_reproducible: "proof_bundle.merkle_root is reproducible across environments"
    3_re_verifiable: "All warden scans produce identical analysis_hash on re-run"
    4_no_authority_without_proof: "issue_url points to a real, open GitHub issue"
    5_no_hidden_state: "All fix artifacts are in the proof bundle; nothing omitted"
    6_no_unverifiable_dependency: "reference_implementation URL is accessible and contains working code"
    7_no_economic_gatekeeping: "Fix is submitted as open-source PR; no paywall, subscription, or license fee"
    8_hash_anchored: "Every artifact has SHA-256 hash in the proof bundle"

# =============================================================================
# EXPECTED OUTPUTS — What the agent delivers
# =============================================================================
expected_outputs:
  - output: "pull_request_url"
    type: "string"
    format: "https://github.com/{owner}/{repo}/pull/{number}"
    description: "URL of the PR submitted to the target repository"

  - output: "proof_bundle.json"
    type: "file"
    schema: "See proof_bundle section above"
    description: "Cryptographic proof bundle with all warden hashes"

  - output: "verification_report.json"
    type: "file"
    description: "Full warden scan results"
    properties:
      seraph_scan: { type: "object", description: "Full SeraphUnit scan output" }
      ophanim_scan: { type: "object", description: "Full OphanimUnit scan output" }
      cherub_scan: { type: "object", description: "Full CherubUnit scan output" }
      peano_report: { type: "object", description: "PeanoInvariantReport.to_dict()" }
      all_gates_passed: { type: "boolean" }
      timestamp: { type: "string", format: "ISO 8601" }

  - output: "task_manifest.json"
    type: "file"
    description: "Complete task record with all fields from task_definition"
    hash_anchored: true
    algorithm: "sha256"

# =============================================================================
# WORKFLOW — Execution order (Peano gate sequencing: S(n) = n + 1)
# =============================================================================
# Per SOP_AI_HANDSHAKE.md: "S(0) = 1, S(n) = n + 1, no gate may be skipped."
workflow:
  gate_sequence:
    - gate: "S(0)"
      name: "ISSUE_ANALYSIS"
      action: "Clone target repo, read issue, identify affected code paths"
      produces: "task_definition.ontological_diagnosis, task_definition.technical_diagnosis"
      blocks_on: "issue_url must resolve to an open GitHub issue"

    - gate: "S(1)"
      name: "REFERENCE_STUDY"
      action: "Read reference implementation, understand the fix pattern"
      produces: "task_definition.technical_diagnosis.reference_implementation"
      blocks_on: "Reference URL must be accessible"

    - gate: "S(2)"
      name: "CODE_GENERATION"
      action: "Generate the fix patch"
      produces: "task_definition.code_fix"
      blocks_on: "S(0) and S(1) must be complete"

    - gate: "S(3)"
      name: "BUILD_VERIFICATION"
      action: "Build the target project with the fix applied"
      produces: "task_definition.code_fix.build_verified"
      blocks_on: "Build must succeed"

    - gate: "S(4)"
      name: "TEST_VERIFICATION"
      action: "Run existing test suite of target project"
      produces: "task_definition.code_fix.tests_pass"
      blocks_on: "All existing tests must pass"

    - gate: "S(5)"
      name: "SERAPH_AUDIT"
      action: "Run SeraphUnit.query('scan') on the fix files"
      produces: "verification_report.seraph_scan"
      blocks_on: "All gated finding_counts == 0"

    - gate: "S(6)"
      name: "OPHANIM_CHECK"
      action: "Run OphanimUnit.query('scan') on the fix files"
      produces: "verification_report.ophanim_scan"
      blocks_on: "dag_acyclic == true, entropy finding_count == 0"

    - gate: "S(7)"
      name: "CHERUB_CHECK"
      action: "Run CherubUnit.query('scan') on fix documentation"
      produces: "verification_report.cherub_scan"
      blocks_on: "No critical/high PII violations, sources verifiable"

    - gate: "S(8)"
      name: "PEANO_CHECK"
      action: "Run peano_invariant_checker if fix touches arithmetic"
      produces: "verification_report.peano_report"
      blocks_on: "report.all_passed == true (when applicable)"

    - gate: "S(9)"
      name: "PROOF_BUNDLE_GENERATION"
      action: "Generate proof_bundle.json with Merkle root over all artifacts"
      produces: "proof_bundle.json"
      blocks_on: "All S(5)-S(8) gates passed"

    - gate: "S(10)"
      name: "PR_SUBMISSION"
      action: "Open PR on target repository with fix + proof bundle link"
      produces: "pull_request_url"
      blocks_on: "proof_bundle.json exists and is valid"

# =============================================================================
# TEST CASE — Farmer's Delight #135 / #1262
# =============================================================================
test_case:
  task_id: "TASK-2026-04-04-001"
  issue_url: "https://github.com/vectorwing/FarmersDelight/issues/1262"
  target_repository: "https://github.com/vectorwing/FarmersDelight"
  ontological_diagnosis:
    root_cause: >
      Minecraft 1.21 changed item data storage from NBT (Named Binary Tag)
      to Data Components. Farmer's Delight block entities store items in
      nested structures that the vanilla data fixer does not recurse into.
    assumption_violated: >
      The vanilla data fixer would automatically convert all item storage
      from NBT to Data Components, including nested inventories.
    causal_chain:
      - "Minecraft 1.21 replaces NBT item storage with Data Components"
      - "Vanilla data fixer converts top-level Items lists"
      - "Farmer's Delight Cooking Pot stores items in Inventory.Items (nested)"
      - "Data fixer does not recurse into Inventory.Items"
      - "Count field (stack size) is dropped during migration"
      - "Players see stack sizes reset to 1 after world upgrade"
  technical_diagnosis:
    affected_files:
      - "src/main/java/.../mixin/datafixer/Schema1460Mixin.java"
    affected_functions:
      - "registerBlockEntities (data fixer schema registration)"
    data_flow: >
      World load → DataFixer → Schema1460 → registerBlockEntities →
      Cooking Pot entity → Inventory → Items → (Count field dropped)
    reference_implementation: >
      https://github.com/Patbox/PolyDecorations/blob/master/src/main/java/eu/pb4/polydecorations/mixin/datafixer/Schema1460Mixin.java
  code_fix:
    patch_format: "unified_diff"
    description: >
      Register Cooking Pot block entity in the data fixer schema with
      nested Inventory.Items path pointing to References.ITEM_STACK:

      .register(map, farmersdelight$mod("cooking_pot"), string ->
          DSL.optionalFields(
              "Inventory",
              DSL.optionalFields("Items", DSL.list(References.ITEM_STACK.in(schema)))
          )
      );
  falsification_conditions:
    - "Place items with Count > 1 in a Cooking Pot in MC 1.20.1, upgrade to 1.21.1, verify Count is preserved"
    - "Place enchanted items in a Cooking Pot in MC 1.20.1, upgrade to 1.21.1, verify enchantments are preserved"
    - "Existing 1.21.1 worlds with Cooking Pots must not be corrupted by the fix"

# =============================================================================
# ATOMIC TASK LIST — Numbered tasks with pass/fail tests
# Each task is atomic: one action, one verifiable result, no skipping allowed.
# Gate sequencing: T(n) blocks T(n+1). No task may be marked PASS until its
# test condition is confirmed by the AI agent or CI.
# =============================================================================
atomic_task_list:

  - id: "T-001"
    name: "CLONE_AND_INDEX_TARGET_REPO"
    action: "Clone vectorwing/FarmersDelight and index the source tree"
    command: "git clone https://github.com/vectorwing/FarmersDelight.git"
    test:
      condition: "src/main/java/ directory exists and is non-empty after clone"
      pass: "Directory tree rooted at src/main/java/ contains at least one .java file"
      fail: "Clone failed or src/main/java/ is absent"

  - id: "T-002"
    name: "LOCATE_DATA_FIXER_REGISTRATION"
    action: >
      Find the data fixer schema registration file. Search for 'Schema1460'
      or 'registerBlockEntities' in the source tree.
    command: "grep -r 'Schema1460\\|registerBlockEntities' src/ --include='*.java' -l"
    test:
      condition: "At least one .java file is returned by the grep"
      pass: "File path printed; agent notes whether a Schema1460Mixin already exists"
      fail: "No file found — data fixer layer is absent; escalate before proceeding"

  - id: "T-003"
    name: "CONFIRM_COOKING_POT_IS_UNREGISTERED"
    action: >
      Confirm that 'cooking_pot' block entity is NOT currently registered
      in the data fixer schema (proving the bug exists).
    command: "grep -r 'cooking_pot' src/ --include='*.java'"
    test:
      condition: "cooking_pot does NOT appear in any data fixer registration block"
      pass: "Bug confirmed: cooking_pot is absent from data fixer registration"
      fail: "cooking_pot IS already registered — bug may already be fixed upstream"

  - id: "T-004"
    name: "IDENTIFY_REFERENCE_IMPLEMENTATION"
    action: >
      Retrieve the reference implementation from PolyDecorations to understand
      the DSL.optionalFields pattern for nested Inventory.Items registration.
    url: "https://github.com/Patbox/PolyDecorations/blob/master/src/main/java/eu/pb4/polydecorations/mixin/datafixer/Schema1460Mixin.java"
    test:
      condition: "Agent can read and summarize the DSL.optionalFields nesting pattern from the file"
      pass: "Pattern confirmed: DSL.optionalFields('Inventory', DSL.optionalFields('Items', DSL.list(References.ITEM_STACK.in(schema))))"
      fail: "URL unreachable or file does not contain the nesting pattern"

  - id: "T-005"
    name: "CREATE_SCHEMA1460_MIXIN"
    action: >
      Create or modify the data fixer mixin to register the cooking_pot block
      entity with nested Inventory.Items → ITEM_STACK path.
    target_file: "src/main/java/.../mixin/datafixer/Schema1460Mixin.java"
    patch: |
      @Mixin(value = Schema1460.class, remap = false)
      public abstract class Schema1460Mixin {
          @Inject(method = "registerBlockEntities", at = @At("RETURN"))
          private static void farmersdelight$registerBlockEntities(
                  Schema schema, Map<String, Supplier<TypeTemplate>> map, CallbackInfo ci) {
              schema.register(map, "farmersdelight:cooking_pot", string ->
                  DSL.optionalFields(
                      "Inventory",
                      DSL.optionalFields(
                          "Items",
                          DSL.list(References.ITEM_STACK.in(schema))
                      )
                  )
              );
          }
      }
    test:
      condition: "The mixin file compiles without errors when ./gradlew compileJava is run"
      pass: "BUILD SUCCESSFUL with zero compilation errors"
      fail: "Compilation error — patch contains incorrect DSL expression or import"

  - id: "T-006"
    name: "BUILD_TARGET_PROJECT"
    action: "Build the full Farmer's Delight project with the mixin applied"
    command: "./gradlew build"
    test:
      condition: "Gradle build exits with code 0"
      pass: "BUILD SUCCESSFUL"
      fail: "BUILD FAILED — fix compilation error before proceeding"

  - id: "T-007"
    name: "RUN_EXISTING_TEST_SUITE"
    action: "Run any existing tests in the target project"
    command: "./gradlew test"
    test:
      condition: "All existing tests pass (or no tests exist — both are PASS)"
      pass: "Test suite exits with code 0 or reports 'No tests found'"
      fail: "Any pre-existing test fails due to the patch"

  - id: "T-008"
    name: "STATIC_ANALYSIS_CHECK"
    action: >
      Run static analysis on the patch. Check for: tautological conditions,
      unreachable code, duplicate logic blocks, missing return paths.
      (Internal: SeraphUnit.query('scan'); External: any static analysis tool
      available in the target project, e.g. checkstyle, spotbugs, or manual review)
    command: "./gradlew check 2>/dev/null || echo 'No check task; manual review required'"
    test:
      condition: "No tautologies, unreachable code, or duplicate logic in the patch"
      pass: "Static analysis clean or manual review finds zero issues in T-005 patch"
      fail: "Tautological condition, unreachable branch, or duplicate block found in patch"

  - id: "T-009"
    name: "CYCLE_AND_DEPENDENCY_CHECK"
    action: >
      Confirm the mixin does not introduce circular imports or unexpected
      dependency on transitive classes not already in the project's compile scope.
    command: "./gradlew dependencies 2>/dev/null | grep -i 'circular\\|cycle' || echo 'No cycles detected'"
    test:
      condition: "Import graph remains acyclic after patch"
      pass: "No circular dependency reported"
      fail: "Circular dependency introduced — refactor import structure"

  - id: "T-010"
    name: "DOCUMENTATION_VALIDATION"
    action: >
      Confirm the PR description contains: (a) a link to the upstream issue,
      (b) an ISO 8601 timestamp, (c) no unverifiable claims ('studies show',
      'experts say', etc.), (d) no PII.
    test:
      condition: "PR description satisfies all four documentation requirements"
      pass: "Issue link present, timestamp present, no unverifiable claims, no PII"
      fail: "Any documentation requirement missing"

  - id: "T-011"
    name: "ARITHMETIC_INTEGRITY_CHECK"
    action: >
      Verify the patch contains no unbounded float literals or float() casts
      in any numeric path that touches item Count or stack size values.
      Item Count is an integer (NBT TAG_Int / Data Component integer).
    test:
      condition: "grep -n 'float\\|Float\\|double\\|Double' <patch-file> returns no hits in Count/stack-size paths"
      pass: "No float arithmetic in the data migration path"
      fail: "Float found in Count arithmetic — replace with integer arithmetic"

  - id: "T-012"
    name: "GENERATE_VERIFICATION_REPORT"
    action: >
      Produce verification_report.json containing results of T-005 through T-011.
      Each task entry must include: task_id, name, pass (bool), evidence (string).
    output_file: "verification_report.json"
    schema:
      type: "object"
      properties:
        task_id: { type: "string" }
        generated_at: { type: "string", format: "ISO 8601" }
        tasks:
          type: "array"
          items:
            type: "object"
            properties:
              id: { type: "string" }
              name: { type: "string" }
              pass: { type: "boolean" }
              evidence: { type: "string" }
        all_passed: { type: "boolean" }
    test:
      condition: "all_passed == true in verification_report.json"
      pass: "All 12 tasks in verification_report.json have pass: true"
      fail: "Any task has pass: false — fix that task before proceeding"

  - id: "T-013"
    name: "SUBMIT_PR_TO_TARGET_REPO"
    action: >
      Open a pull request on vectorwing/FarmersDelight with:
      - Title: 'fix: register cooking_pot block entity in data fixer schema (fixes #1262)'
      - Body: copy-paste from secular_developer_patch.pr_body (see below)
      - Linked issue: #1262
    test:
      condition: "PR URL is returned and PR is in 'open' state"
      pass: "https://github.com/vectorwing/FarmersDelight/pull/{N} is accessible and open"
      fail: "PR creation failed or PR was immediately closed/rejected by bot"

# =============================================================================
# SECULAR DEVELOPER PATCH
# ─────────────────────────────────────────────────────────────────────────────
# COPY-PASTE THIS SECTION FOR EXTERNAL PR SUBMISSION.
# No internal tooling names, no theological naming.
# Everything here is verifiable by any Java developer with a Minecraft modding
# environment. Paste pr_body directly into the GitHub PR description field.
# =============================================================================
secular_developer_patch:

  issue_reference: "https://github.com/vectorwing/FarmersDelight/issues/1262"
  target_repository: "https://github.com/vectorwing/FarmersDelight"
  pr_title: "fix: register cooking_pot block entity in data fixer schema (fixes #1262)"
  timestamp: "2026-04-04T02:04:16Z"

  # ── COPY THIS BLOCK AS THE PR BODY ──────────────────────────────────────────
  pr_body: |
    ## Problem

    When upgrading a world from Minecraft 1.20.1 to 1.21+, items stored inside
    a **Cooking Pot** block entity lose their stack size (Count resets to 1).
    Enchantments and other NBT data on those items are also silently dropped.

    Reported in: https://github.com/vectorwing/FarmersDelight/issues/1262
    (Also discussed in: https://github.com/vectorwing/FarmersDelight/issues/135)

    ---

    ## Root Cause

    Minecraft 1.21 migrated item data storage from NBT (`TAG_Byte Count`,
    `TAG_String id`, etc.) to **Data Components** (`minecraft:count`,
    `minecraft:custom_data`, etc.). This migration is handled by the vanilla
    `DataFixer` system, specifically `Schema1460`.

    `Schema1460.registerBlockEntities()` must explicitly register every
    block entity type that contains items so the data fixer knows to recurse
    into those item stacks and convert them.

    Farmer's Delight stores Cooking Pot inventory under the path:

        BlockEntityTag → Inventory → Items → [list of ITEM_STACK]

    Because `farmersdelight:cooking_pot` was never registered in
    `Schema1460.registerBlockEntities()`, the data fixer skips the entire
    `Inventory` sub-tree. Result: item Count and all NBT data on those items
    are silently lost during world upgrade.

    ---

    ## Causal Chain

    1. Minecraft 1.21 replaces NBT item storage with Data Components.
    2. Vanilla `DataFixer` runs `Schema1460.registerBlockEntities()` on world load.
    3. Only block entities explicitly registered in that method are recursed into.
    4. `farmersdelight:cooking_pot` is not registered → `Inventory.Items` is skipped.
    5. `Count` field (stack size) is not converted → resets to default (1).
    6. Player opens Cooking Pot after upgrade → all stack sizes show as 1.

    ---

    ## Fix

    Register `farmersdelight:cooking_pot` in the data fixer schema using a Mixin
    on `Schema1460`, following the same pattern used by other mods that store
    items in nested block entity structures.

    **Reference implementation** (PolyDecorations mod — same pattern, working):
    https://github.com/Patbox/PolyDecorations/blob/master/src/main/java/eu/pb4/polydecorations/mixin/datafixer/Schema1460Mixin.java

    ### New file: `src/main/java/.../mixin/datafixer/Schema1460Mixin.java`

    ```java
    package vectorwing.farmersdelight.mixin.datafixer;

    import com.mojang.datafixers.DSL;
    import com.mojang.datafixers.schemas.Schema;
    import com.mojang.datafixers.types.templates.TypeTemplate;
    import com.mojang.datafixers.util.Pair;
    import net.minecraft.util.datafix.fixes.References;
    import net.minecraft.util.datafix.schemas.Schema1460;
    import org.spongepowered.asm.mixin.Mixin;
    import org.spongepowered.asm.mixin.injection.At;
    import org.spongepowered.asm.mixin.injection.Inject;
    import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

    import java.util.Map;
    import java.util.function.Supplier;

    @Mixin(value = Schema1460.class, remap = false)
    public abstract class Schema1460Mixin {

        @Inject(method = "registerBlockEntities", at = @At("RETURN"))
        private static void farmersdelight$registerBlockEntities(
                Schema schema,
                Map<String, Supplier<TypeTemplate>> map,
                CallbackInfo ci) {

            // Register cooking_pot so the DataFixer recurses into Inventory.Items
            // and converts each ITEM_STACK from NBT to Data Components.
            schema.register(map, "farmersdelight:cooking_pot", string ->
                DSL.optionalFields(
                    "Inventory",
                    DSL.optionalFields(
                        "Items",
                        DSL.list(References.ITEM_STACK.in(schema))
                    )
                )
            );
        }
    }
    ```

    ### Mixin registration: `src/main/resources/farmersdelight.mixins.json`

    Add `"mixin.datafixer.Schema1460Mixin"` to the `"mixins"` array:

    ```json
    {
      "mixins": [
        "...",
        "mixin.datafixer.Schema1460Mixin"
      ]
    }
    ```

    ---

    ## Math / Data Integrity

    The `Count` field is a signed 32-bit integer (`TAG_Int` in NBT, integer
    component in Data Components). The fix performs no arithmetic on `Count`;
    it only registers the path so the vanilla converter can find and migrate it.
    There is no numeric transformation, no floating-point arithmetic, no
    precision loss.

    Formally: let `c ∈ ℤ` be the item count before migration. After applying
    this fix, the data fixer produces `c' = c` (identity). Without the fix,
    `c'` is undefined (field dropped), effectively `c' = 1` (default).

    ---

    ## How to Verify

    1. Create a Minecraft 1.20.1 world with Farmer's Delight installed.
    2. Place a Cooking Pot. Fill it with a stack of 64 bread.
    3. Save and close the world.
    4. Upgrade to Minecraft 1.21 with this PR's build of Farmer's Delight.
    5. Open the world. Open the Cooking Pot.
    6. **Expected (with fix):** Stack of 64 bread is present.
    7. **Expected (without fix):** 1 bread is present (bug).

    Additional falsification conditions:
    - Enchanted items in a Cooking Pot must retain their enchantments after upgrade.
    - Existing 1.21.1 worlds with Cooking Pots must not be corrupted by this fix.
    - If no items were in a Cooking Pot at upgrade time, the fix must have no effect.

    ---

