        expected_exit_code: 2

    - id: "trace_generation_failed"
      name: "Trace Generation Failed"
      description: "Trace document generation failed"
      action:
        type: "shell_command"
        parameters:
          command: "echo 'ERROR: Trace generation failed. Check trace schema and data.' && exit 2"
        timeout_seconds: 5
        expected_exit_code: 2

    - id: "evidence_verification_failed"
      name: "Evidence Verification Failed"
      description: "Evidence chain verification failed"
      action:
        type: "shell_command"
        parameters:
          command: "echo 'ERROR: Evidence verification failed. Check evidence chains and confidence thresholds.' && exit 2"
        timeout_seconds: 5
        expected_exit_code: 2

    - id: "debt_calculation_failed"
      name: "Debt Calculation Failed"
      description: "Explanatory debt calculation failed"
      action:
        type: "shell_command"
        parameters:
          command: "echo 'ERROR: Debt calculation failed. Check debt data and calculation logic.' && exit 2"
        timeout_seconds: 5
        expected_exit_code: 2

    - id: "trace_enrichment_failed"
      name: "Trace Enrichment Failed"
      description: "Trace enrichment failed"
      action:
        type: "shell_command"
        parameters:
          command: "echo 'ERROR: Trace enrichment failed. Check enrichment configuration and data.' && exit 2"
        timeout_seconds: 5
        expected_exit_code: 2

    - id: "final_validation_failed"
      name: "Final Validation Failed"
      description: "Final validation failed"
      action:
        type: "shell_command"
        parameters:
          command: "echo 'ERROR: Final validation failed. Check validation criteria and reports.' && exit 2"
        timeout_seconds: 5
        expected_exit_code: 2

validation:
