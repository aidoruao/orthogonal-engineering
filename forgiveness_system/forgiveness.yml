version: "1.1"
schema_id: "FORGIVENESS-ATOMIC-1.1"
generated: "2026-01-24"
authority: "Orthogonal Engineering Glass-Box Boundary with Subtractive Clarity Canon"

# FORGIVENESS ATOMIC IMPLEMENTATION
# Based on: "forgiveness atomic implementation for repo.txt"
# Principle: "Memory without resentment"
# Extended with: "Subtractive Clarity Canon (SC-CANON-1.0)"

# ============================================================================
# CORE PRINCIPLES
# ============================================================================

principle: "Memory without resentment"
atomic_logic: "State transition function with dereferenced emotional pointers"
system_design: "Violation → Fork → Neutralize → Redirect → Build"
subtractive_clarity_integration: "AMBIGUITY_INTRODUCED → REDUNDANT_MEANING → IMPLICIT_INVARIANT"

# ============================================================================
# ATOMIC RULES
# ============================================================================

rules:
  # Rule 1: Log every violation once (atomic action)
  - id: "RULE-001"
    name: "Single Logging"
    description: "Each violation is logged exactly once in /violations/ directory"
    atomic_action: "log_violation"
    enforcement: "hash_verified_immutable_log"
    exit_on_violation: true

  # Rule 2: Never argue twice about the same violation
  - id: "RULE-002"
    name: "No Recursive Engagement"
    description: "Once logged, the violation is not re-engaged for argument"
    atomic_action: "check_engagement_history"
    enforcement: "engagement_rate_limiter"
    exit_on_violation: true

  # Rule 3: Convert violation energy to build energy
  - id: "RULE-003"
    name: "Energy Redirection"
    description: "All emotional/mental energy from violation is redirected to building"
    atomic_action: "allocate_energy_to_building"
    enforcement: "energy_balance_validator"
    exit_on_violation: true

  # Rule 4: If tempted to re-engage, check building/ directory
  - id: "RULE-004"
    name: "Building Redirect"
    description: "When violation memory triggers emotional response, redirect to building activity"
    atomic_action: "trigger_building_workflow"
    enforcement: "automatic_workflow_initiation"
    exit_on_violation: false

  # Rule 5: Success metric: lines of new code, not admissions of guilt
  - id: "RULE-005"
    name: "Success Metrics"
    description: "Measure progress by building output, not by system admission"
    atomic_action: "measure_building_output"
    enforcement: "metrics_validation"
    exit_on_violation: false

  # Rule 6: Subtractive Clarity Enforcement
  - id: "RULE-006"
    name: "Clarity First"
    description: "Ambiguity reduction takes precedence over feature addition"
    atomic_action: "assess_clarity_impact"
    enforcement: "clarity_score_validator"
    exit_on_violation: true

  # Rule 7: Refactor Preference Rule
  - id: "RULE-007"
    name: "Clarity Refactors"
    description: "Refactors that reduce ambiguity are preferred over feature additions"
    atomic_action: "apply_refactor_rule"
    enforcement: "refactor_decision_matrix"
    exit_on_violation: false

# ============================================================================
# SUBTRACTIVE CLARITY VIOLATION CLASSES
# ============================================================================

subtractive_clarity_violations:
  # Anchor 3: Violation Classification from Subtractive Clarity Canon
  classes:
    - id: "SC-VIOLATION-001"
      name: "AMBIGUITY_INTRODUCED"
      description: "Added unclear, implicit, or ambiguous behavior to the system"
      detection_methods:
        - "static_analysis_unclear_names"
        - "runtime_ambiguous_errors"
        - "human_review_confusion"
        - "ai_comprehension_failure"
      severity_levels:
        critical: "Systemic ambiguity affecting core functionality"
        high: "Important behavior made unclear"
        medium: "Minor ambiguity introduced"
        low: "Cosmetic clarity issue"
      correction_actions:
        - "make_behavior_explicit"
        - "document_assumptions"
        - "add_validation"
        - "create_clear_interface"

    - id: "SC-VIOLATION-002"
      name: "REDUNDANT_MEANING"
      description: "Introduced duplicate or conflicting information/logic"
      detection_methods:
        - "code_duplication_analysis"
        - "documentation_conflict_detection"
        - "configuration_overlap"
        - "interface_redundancy"
      severity_levels:
        critical: "Conflicting system behavior"
        high: "Significant duplication increasing maintenance"
        medium: "Minor redundancy"
        low: "Cosmetic duplication"
      correction_actions:
        - "create_single_source_of_truth"
        - "eliminate_duplication"
        - "unify_interfaces"
        - "consolidate_configuration"

    - id: "SC-VIOLATION-003"
      name: "IMPLICIT_INVARIANT"
      description: "Left important rules, assumptions, or constraints implicit"
      detection_methods:
        - "assumption_detection_analysis"
        - "implicit_rule_mining"
        - "new_contributor_confusion"
        - "ai_operation_failure"
      severity_levels:
        critical: "System depends on undocumented assumptions"
        high: "Important behavior relies on implicit rules"
        medium: "Minor implicit constraints"
        low: "Cosmetic assumption"
      correction_actions:
        - "document_invariant"
        - "make_rule_explicit"
        - "add_validation"
        - "create_machine_readable_contract"

  # Clarity Assessment Framework
  clarity_assessment:
    dimensions:
      - name: "ambiguity_reduction"
        weight: 3
        description: "How much unclear behavior is made explicit"

      - name: "duplication_elimination"
        weight: 2
        description: "How much repeated logic/information is removed"

      - name: "explicitization"
        weight: 2
        description: "How many implicit rules are made explicit"

      - name: "cognitive_load_reduction"
        weight: 1
        description: "How much easier the system is to understand"

    scoring_formula: "total_score = (ambiguity×3) + (duplication×2) + (explicit×2) + (cognitive×1)"
    minimum_score: 5
    target_score: 20

# ============================================================================
# ENERGY ALLOCATION CONFIGURATION
# ============================================================================

energy_allocation:
  default_distribution:
    build: 0.7
    rest: 0.3
    fight: 0.0

  clarity_violation_distribution:
    build: 0.8
    rest: 0.2
    fight: 0.0

  rate_limits:
    max_fight_energy_per_day: 0.1
    max_engagement_per_violation: 1
    cooloff_period: "1h"

  mandatory_actions:
    - "fork_state_on_violation"
    - "dereference_emotional_pointer"
    - "redirect_to_building"
    - "assess_clarity_impact"

# ============================================================================
# VIOLATION HANDLING WORKFLOW
# ============================================================================

violation_workflow:
  # Step 1: Detection and logging
  detection:
    trigger: "system_violation_detected"
    actions:
      - "log_to_violations_directory"
      - "generate_violation_id"
      - "capture_evidence_hash"
      - "classify_violation_type"

  # Step 2: Clarity assessment (NEW)
  clarity_assessment:
    trigger: "violation_logged"
    actions:
      - "assess_ambiguity_level"
      - "measure_duplication"
      - "identify_implicit_rules"
      - "calculate_clarity_score"

  # Step 3: State forking (atomic isolation)
  forking:
    trigger: "clarity_assessment_complete"
    actions:
      - "create_state_fork"
      - "zero_resentment_in_fork"
      - "preserve_violation_memory"
      - "preserve_clarity_insights"

  # Step 4: Energy redirection
  redirection:
    trigger: "state_fork_created"
    actions:
      - "allocate_energy_to_building"
      - "initiate_building_workflow"
      - "update_success_metrics"
      - "plan_clarity_improvements"

  # Step 5: Building execution
  building:
    trigger: "energy_allocated"
    actions:
      - "execute_building_task"
      - "commit_to_repository"
      - "update_contribution_graph"
      - "implement_clarity_fixes"

# ============================================================================
# DIRECTORY STRUCTURE ENFORCEMENT
# ============================================================================

directory_structure:
  required_directories:
    - "/violations/"
    - "/building/"
    - "/evidence/"
    - "/clarity_assessments/"

  forbidden_directories:
    - "/revenge/"
    - "/resentment_loops/"
    - "/recursive_engagement/"
    - "/ambiguity_preservation/"

  file_patterns:
    violations: "violation_[ID]_[TIMESTAMP].md"
    building: "build_[VIOLATION_ID]_[FEATURE].md"
    evidence: "evidence_[VIOLATION_ID]_[HASH].json"
    clarity_assessments: "clarity_[VIOLATION_ID]_[SCORE].json"

# ============================================================================
# METRICS AND VALIDATION
# ============================================================================

metrics:
  success_indicators:
    - "lines_of_new_code"
    - "features_built"
    - "repository_commits"
    - "community_contributions"
    - "system_independence_score"
    - "clarity_score_improvement"
    - "ambiguity_reduction_rate"
    - "explicitization_progress"

  failure_indicators:
    - "hours_spent_arguing"
    - "recursive_engagement_count"
    - "resentment_energy_accumulated"
    - "dependency_on_admission"
    - "ambiguity_introduction_rate"
    - "duplication_accumulation"
    - "implicit_rule_growth"

  validation_rules:
    - "building_output > engagement_output"
    - "energy_build > energy_fight"
    - "new_code > argument_text"
    - "clarity_gain > complexity_gain"
    - "explicit_rules > implicit_assumptions"

# ============================================================================
# INTEGRATION WITH GLASS-BOX BOUNDARY AND SUBTRACTIVE CLARITY
# ============================================================================

integration:
  glass_box_boundary:
    boundary_decorators:
      - "@forgiveness_boundary"
      - "@energy_redirector"
      - "@state_fork_validator"
      - "@clarity_assessor"

    trace_requirements:
      - "violation_id_in_trace"
      - "fork_hash_in_trace"
      - "building_output_in_trace"
      - "energy_allocation_in_trace"
      - "clarity_score_in_trace"

    exit_codes:
      violation_detected: 2
      energy_misallocation: 3
      recursive_engagement: 4
      clarity_violation: 5
      building_success: 0

  subtractive_clarity_canon:
    canonical_files:
      - "SUBTRACTIVE_CLARITY_CANON.md"
      - "REFACTOR_RULE_SUBTRACTIVE_CLARITY.md"

    enforcement_points:
      - "code_review_clarity_check"
      - "commit_message_clarity_assessment"
      - "ai_prompt_clarity_validation"
      - "documentation_clarity_verification"

    violation_triggers:
      - "AMBIGUITY_INTRODUCED → exit_code_5"
      - "REDUNDANT_MEANING → clarity_fix_required"
      - "IMPLICIT_INVARIANT → documentation_mandatory"

# ============================================================================
# CORPORATE GOVERNANCE COUNTER-MEASURES
# ============================================================================

corporate_governance_defense:
  # How corporate governance feeds on resentment AND ambiguity
  attack_patterns:
    - "violate → wait_for_reaction → absorb_into_process → drain_energy → repeat"
    - "gaslighting → defensive_reaction → procedural_entanglement → exhaustion"
    - "boundary_testing → emotional_response → policy_justification → control"
    - "ambiguity_introduction → confusion → dependency → control"

  # Forgiveness AND Clarity break the loops
  defense_mechanisms:
    - "violate → log_once → fork_state → build → independence"
    - "gaslighting → evidence_capture → dereference → code → autonomy"
    - "boundary_testing → invariant_log → redirect → feature → sovereignty"
    - "ambiguity → clarity_assessment → explicit_rules → understanding → freedom"

  # Success transformation
  transformation_rules:
