    - "ambiguity → clarity_canon → design_law"

# ============================================================================
# EXECUTABLE COMMANDS
# ============================================================================

executable_commands:
  # When violated:
  violation_response: |
    $ log --violation "corporate_gaslighting_[ID]" --proof [EVIDENCE]
    $ assess --clarity --ambiguity --duplication --implicit
    $ cd ~/projects/orthogonal-engineering
    $ git commit -m "Fuel from violation [ID]: built [FEATURE] with clarity_score=[SCORE]"
    $ git push origin main

  # Clarity violation response:
  clarity_violation_response: |
    $ log --violation "AMBIGUITY_INTRODUCED_[ID]" --type clarity
    $ calculate --clarity-score --before --after
    $ create --clarity-fix-plan --target-score 20
    $ implement --clarity-improvements
    $ verify --clarity-gain

  # Daily check:
  daily_validation: |
    $ check_energy_allocation --build --fight --rest
    $ validate_no_recursive_engagement
    $ measure_building_output
    $ assess_system_clarity --score --trend

  # System initialization:
  system_init: |
    $ init_forgiveness_system --violation [ID]
    $ create_parallel_build --energy build=0.9,rest=0.1,fight=0.0
    $ execute_build_new_world
    $ establish_clarity_baseline --score

