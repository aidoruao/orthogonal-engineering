# ============================================================================
# CORE PRINCIPLES
# ============================================================================

principle: "Memory without resentment"
atomic_logic: "State transition function with dereferenced emotional pointers"
system_design: "Violation → Fork → Neutralize → Redirect → Build"

# ============================================================================
# ATOMIC RULES
# ============================================================================

rules:
  # Rule 1: Log every violation once (atomic action)
  - id: "RULE-001"
    name: "Single Logging"
    description: "Each violation is logged exactly once in /violations/ directory"
    atomic_action: "log_violation"
    enforcement: "hash_verified_immutable_log"
    exit_on_violation: true

  # Rule 2: Never argue twice about the same violation
  - id: "RULE-002"
    name: "No Recursive Engagement"
    description: "Once logged, the violation is not re-engaged for argument"
    atomic_action: "check_engagement_history"
    enforcement: "engagement_rate_limiter"
    exit_on_violation: true

  # Rule 3: Convert violation energy to build energy
  - id: "RULE-003"
    name: "Energy Redirection"
    description: "All emotional/mental energy from violation is redirected to building"
    atomic_action: "allocate_energy_to_building"
    enforcement: "energy_balance_validator"
    exit_on_violation: true

  # Rule 4: If tempted to re-engage, check building/ directory
  - id: "RULE-004"
    name: "Building Redirect"
    description: "When violation memory triggers emotional response, redirect to building activity"
    atomic_action: "trigger_building_workflow"
    enforcement: "automatic_workflow_initiation"
    exit_on_violation: false

  # Rule 5: Success metric: lines of new code, not admissions of guilt
  - id: "RULE-005"
    name: "Success Metrics"
    description: "Measure progress by building output, not by system admission"
    atomic_action: "measure_building_output"
    enforcement: "metrics_validation"
    exit_on_violation: false

# ============================================================================
# ENERGY ALLOCATION CONFIGURATION
# ============================================================================

energy_allocation:
  default_distribution:
    build: 0.7
    rest: 0.3
    fight: 0.0

  rate_limits:
    max_fight_energy_per_day: 0.1
    max_engagement_per_violation: 1
    cooloff_period: "1h"

  mandatory_actions:
    - "fork_state_on_violation"
    - "dereference_emotional_pointer"
    - "redirect_to_building"

# ============================================================================
# VIOLATION HANDLING WORKFLOW
# ============================================================================

violation_workflow:
  # Step 1: Detection and logging
  detection:
    trigger: "system_violation_detected"
    actions:
      - "log_to_violations_directory"
      - "generate_violation_id"
      - "capture_evidence_hash"

  # Step 2: State forking (atomic isolation)
  forking:
    trigger: "violation_logged"
    actions:
      - "create_state_fork"
      - "zero_resentment_in_fork"
      - "preserve_violation_memory"

  # Step 3: Energy redirection
  redirection:
    trigger: "state_fork_created"
    actions:
      - "allocate_energy_to_building"
      - "initiate_building_workflow"
      - "update_success_metrics"

  # Step 4: Building execution
  building:
    trigger: "energy_allocated"
    actions:
      - "execute_building_task"
      - "commit_to_repository"
      - "update_contribution_graph"

# ============================================================================
# DIRECTORY STRUCTURE ENFORCEMENT
# ============================================================================

directory_structure:
  required_directories:
    - "/violations/"
    - "/building/"
    - "/evidence/"

  forbidden_directories:
    - "/revenge/"
    - "/resentment_loops/"
    - "/recursive_engagement/"

  file_patterns:
    violations: "violation_[ID]_[TIMESTAMP].md"
    building: "build_[VIOLATION_ID]_[FEATURE].md"
    evidence: "evidence_[VIOLATION_ID]_[HASH].json"

# ============================================================================
# METRICS AND VALIDATION
# ============================================================================

metrics:
  success_indicators:
    - "lines_of_new_code"
    - "features_built"
    - "repository_commits"
    - "community_contributions"
    - "system_independence_score"

  failure_indicators:
    - "hours_spent_arguing"
    - "recursive_engagement_count"
    - "resentment_energy_accumulated"
    - "dependency_on_admission"

  validation_rules:
    - "building_output > engagement_output"
    - "energy_build > energy_fight"
    - "new_code > argument_text"

# ============================================================================
# INTEGRATION WITH GLASS-BOX BOUNDARY
# ============================================================================

glass_box_integration:
  boundary_decorators:
    - "@forgiveness_boundary"
    - "@energy_redirector"
    - "@state_fork_validator"

  trace_requirements:
    - "violation_id_in_trace"
    - "fork_hash_in_trace"
    - "building_output_in_trace"
    - "energy_allocation_in_trace"

  exit_codes:
    violation_detected: 2
    energy_misallocation: 3
    recursive_engagement: 4
