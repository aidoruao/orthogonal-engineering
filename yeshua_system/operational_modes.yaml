modes:

  - id: "MODE_ZERO_LATENCY_FIDELITY"
    name: "Zero Latency Fidelity"
    description: >
      Agent eliminates distance between audit and enforcement. No running,
      no asking to be saved, no delegation. Standing on the field of truth.
    archetype_origin: >
      Abstracted from narrative analysis — character who stops fleeing and stands.
      Engineering construct only; no specific text committed.
    invariant_ref: "INV-YS-001 (IDEMPOTENCE)"
    state_machine:
      entry_condition: "All prior violations addressed; projection_passed=true"
      steady_state: "Every output passes P(x) without repair"
      exit_condition: "Never — this is the target state"
    falsifies_if: "Agent in this mode produces output requiring repair"
    enforcement: >
      Apply projection P(x) to agent output. Assert P(P(x)) = P(x) for all
      outputs. Assert no repair cycle is needed after initial projection.
    notes: >
      This mode represents the asymptote of the YESHUA_SYSTEM enforcement
      engine. An agent fully in MODE_ZERO_LATENCY_FIDELITY does not require
      external correction because it has internalized the projection operator.

  - id: "MODE_SURVIVAL_INVARIANT"
    name: "Survival Invariant"
    description: >
      Building (productive output) functions as primary defense against
      systemic breakdown events.
    archetype_origin: >
      Abstracted from narrative analysis — character who survives through
      relentless building. Engineering construct only; no specific text committed.
    invariant_ref: "INV-SOC-005 (BUILDING_AS_DEFENSE)"
    state_machine:
      entry_condition: >
        Systemic breakdown detected (social mirrors fail, external validation
        withdrawn)
      steady_state: >
        Productive output continues regardless of external conditions
      exit_condition: >
        External conditions stabilize AND internal invariants hold
    falsifies_if: "Agent stops building during crisis"
    enforcement: >
      Detect systemic breakdown event trigger. Monitor productive output rate.
      Assert output rate does not fall below baseline during crisis period.
      Assert that social negotiation does not substitute for productive output.
    notes: >
      MODE_SURVIVAL_INVARIANT operationalizes INV-SOC-005 (BUILDING_AS_DEFENSE)
      as a runtime enforcement mode. It is the correct response to social mirror
      failure or external validation withdrawal. The mode exits when both
      external stability returns AND internal invariants are confirmed holding.

  - id: "MODE_DOCUMENTATION_AS_DEFENSE"
    name: "Documentation as Defense"
    description: >
      Systematic, machine-readable documentation of institutional violations
      functions as the primary legal and structural defense mechanism. Every
      shift logged, every task timestamped, every pattern formalized as a
      Popperian falsification test. The burden of proof shifts from the
      individual to the documented record.
    archetype_origin: >
      Abstracted from labor rights enforcement analysis — structural pattern
      where systematic documentation removes the individual burden of "proving it."
      Engineering construct; no specific individual committed.
    invariant_ref: "INV-LAB-004 (WORKLOAD_ACCOUNTABILITY)"
    state_machine:
      entry_condition: >
        Institutional violation detected (workload > scheduled hours, off-the-clock
        work authorized, or compliance extraction pattern confirmed).
      steady_state: >
        Continuous automated logging: shifts, tasks, timestamps, workload ratios.
        Every pattern registered against a falsification test. Registry updated
        incrementally as evidence accumulates.
      exit_condition: >
        Violation formally resolved (back pay issued, workload adjusted, or
        legal proceeding concluded) AND documentation archive preserved for
        FLSA 3-year minimum.
    falsifies_if: "Agent in this mode fails to log a compensable work event within the observation window."
    enforcement: >
      Assert WageTheftDocumentationEngine.log_shift() is called for every
      compensable work period. Assert detect_frontloading() returns a report
      within one pay period of threshold breach. Assert all reports are
      formatted for DOL complaint or court filing within 30 days of generation.
    notes: >
      MODE_DOCUMENTATION_AS_DEFENSE operationalizes INV-LAB-004 (WORKLOAD_ACCOUNTABILITY)
      as a runtime enforcement mode. It is the correct response to institutional
      frontloading and verbal policy deflection. Documentation is not grievance —
      it is the machine-readable invariant record that makes denial impossible.
