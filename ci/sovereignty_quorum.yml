# ci/sovereignty_quorum.yml
# PR #38 — Autonomous Mathematical Sovereignty Layer (AMSL)
# Standard: Yeshua
# Version: 1.0.0
#
# Enforces the Multi-Independent Verification Network (MIVN) quorum requirement.
# Minimum quorum: 3 independent OS environments (representing independent vendors).
# No single maintainer override is permitted.

name: AMSL Sovereignty Quorum

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONIOENCODING: utf-8
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "38"

permissions:
  contents: read

jobs:
  quorum-node:
    name: Quorum Node (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 1 — Verify frozen spec integrity
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib, sys

          freeze_path = pathlib.Path('resilience/invariant_spec_v1.freeze')
          spec_dir = pathlib.Path('spec')

          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))
          print(f"Freeze version: {freeze['freeze_version']}")

          spec_files = [p for p in spec_dir.glob('*.json')]
          if not spec_files:
              print('ERROR: No spec files found')
              sys.exit(1)

          for p in sorted(spec_files):
              data = json.loads(p.read_text(encoding='utf-8'))
              assert data.get('frozen') is True, f'{p}: frozen != true'
              print(f'OK: {p} is frozen')

          print('SPEC INTEGRITY: PASSED')
          EOF

      - name: 2 — Peano reducibility pass
        run: python yeshua_math/peano_invariant_checker.py

      - name: 3 — Boolean completeness pass
        run: python yeshua_math/boolean_purity_validator.py

      - name: 4 — Pure reference runtime cross-validation
        run: python yeshua_math/pure_reference_runtime/cross_validator.py

      - name: 5 — Produce node proof bundle
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib, sys
          from datetime import datetime, timezone

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          spec_dir = pathlib.Path('spec')
          spec_hashes = {}
          for p in sorted(spec_dir.glob('*.json')):
              spec_hashes[str(p)] = sha256(p.read_bytes())

          env_content = pathlib.Path('bootstrap/toolchain.lock').read_bytes()
          env_hash = sha256(env_content)

          spec_content = json.dumps(spec_hashes, sort_keys=True).encode('utf-8')
          output_hash = sha256(spec_content)

          leaf_hashes = sorted([env_hash, output_hash])
          merkle_root = sha256('|'.join(leaf_hashes).encode('utf-8'))

          bundle = {
              'merkle_root': merkle_root,
              'output_hash': output_hash,
              'environment_hash': env_hash,
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'invariant_spec_version': 'v1',
              'node_id': 'ci-${{ matrix.os }}-py${{ matrix.python-version }}',
          }
          pathlib.Path('proof_bundle.json').write_text(json.dumps(bundle, indent=2))
          print(json.dumps(bundle, indent=2))
          EOF

      - name: Upload quorum node proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: quorum-proof-${{ matrix.os }}-py${{ matrix.python-version }}
          path: proof_bundle.json
          if-no-files-found: error

  sovereignty-quorum-gate:
    name: Sovereignty Quorum Gate (3-node minimum)
    needs: quorum-node
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all quorum proof bundles
        uses: actions/download-artifact@v4
        with:
          pattern: quorum-proof-*
          path: /tmp/quorum_proofs

      - name: Assert quorum >= 3 nodes and all Merkle roots agree
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          proof_files = list(pathlib.Path('/tmp/quorum_proofs').rglob('proof_bundle.json'))
          print(f'Quorum nodes found: {len(proof_files)}')

          if len(proof_files) < 3:
              print(f'SOVEREIGNTY QUORUM: FAILED — only {len(proof_files)} nodes, minimum is 3')
              sys.exit(1)

          roots = set()
          for f in proof_files:
              data = json.loads(f.read_text())
              roots.add(data['merkle_root'])
              print(f'  {f.parent.name}: merkle_root={data["merkle_root"]}')

          if len(roots) != 1:
              print(f'SOVEREIGNTY QUORUM: FAILED — {len(roots)} distinct Merkle roots')
              sys.exit(1)

          print(f'SOVEREIGNTY QUORUM: PASSED — {len(proof_files)} independent nodes agree')
          EOF

      - name: Compute and verify spec file hashes
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib, sys

          spec_dir = pathlib.Path('spec')
          freeze = json.loads(pathlib.Path('resilience/invariant_spec_v1.freeze').read_text())

          frozen_paths = {e['path'] for e in freeze.get('spec_files', [])}
          live_paths = {str(p) for p in spec_dir.glob('*.json')}

          for p in sorted(spec_dir.glob('*.json')):
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'  {p}: {h}')

          print('SPEC HASH VERIFICATION: PASSED')
          EOF
