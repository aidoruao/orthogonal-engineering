# ci/yeshua_pipeline.yml
# Yeshua Mathematics Layer (YML) Enforcement Pipeline
# PR #37 — Distributed Verifiable Compute Layer
# Standard: Yeshua
# Version: 1.0.0
#
# Enforces all Yeshua Mathematics Layer invariants:
#   - Peano arithmetic reducibility
#   - Boolean logic purity
#   - Pure reference runtime cross-validation
#   - Benchmark reproducibility
#   - Zero-trust merge gate

name: Yeshua Mathematics Layer Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONIOENCODING: utf-8
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "37"

permissions:
  contents: read

jobs:
  yml-enforcement:
    name: YML Enforcement (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 1 — Static invariant scan
        run: python -m pytest tests/test_axioms.py -v

      - name: 2 — Determinism enforcement
        run: python dvcl/determinism_guard.py

      - name: 3 — Peano reducibility validation
        run: python yeshua_math/peano_invariant_checker.py

      - name: 4 — Boolean completeness validation
        run: python yeshua_math/boolean_purity_validator.py

      - name: 5 — Pure reference runtime cross-validation
        run: python yeshua_math/pure_reference_runtime/cross_validator.py

      - name: 6 — Yeshua enforcement layer
        run: python -m pytest tests/test_yeshua_enforcement.py -v

      - name: 7 — PR #37 schema tests
        run: python -m pytest tests/test_pr37_schema.py -v

      - name: 8 — Global Merkle root
        run: python -m pytest tests/test_global_merkle.py -v

      - name: Upload Merkle root artifact
        uses: actions/upload-artifact@v4
        with:
          name: yml-merkle-root-${{ matrix.os }}-py${{ matrix.python-version }}
          path: merkle/global_root.json
          if-no-files-found: error

  zero-trust-merge-gate:
    name: Zero-Trust Merge Gate
    needs: yml-enforcement
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all Merkle root artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yml-merkle-root-*
          path: /tmp/yml_merkle_roots

      - name: Assert all roots are identical (cross-platform hash parity)
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          root_files = list(pathlib.Path('/tmp/yml_merkle_roots').rglob('global_root.json'))
          if not root_files:
              print('ERROR: No Merkle root artifacts found')
              sys.exit(1)

          roots = set()
          for f in root_files:
              data = json.loads(f.read_text())
              roots.add(data['root_hash'])
              print(f'  {f.parent.name}: {data["root_hash"]}')

          if len(roots) != 1:
              print(f'ZERO-TRUST GATE: HASH DIVERGENCE across {len(root_files)} nodes')
              sys.exit(1)

          print(f'ZERO-TRUST GATE: PASSED — all {len(root_files)} nodes agree')
          EOF
