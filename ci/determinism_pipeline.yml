# ci/determinism_pipeline.yml
# DVCL Determinism Enforcement Pipeline
# PR #37 — Distributed Verifiable Compute Layer
# Standard: Yeshua
# Version: 1.0.0
#
# This pipeline enforces deterministic execution for all workloads.
# Any non-determinism detected causes an immediate CI failure.

name: DVCL Determinism Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONIOENCODING: utf-8
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "37"

permissions:
  contents: read

jobs:
  determinism-guard:
    name: Determinism Guard (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify canonical_env.lock exists
        run: python -c "from pathlib import Path; assert Path('dvcl/canonical_env.lock').exists()"

      - name: Run determinism guard
        run: python dvcl/determinism_guard.py

      - name: Run DVCL tests
        run: python -m pytest tests/test_pr37_schema.py -v -k "determinism"
