# Self-Cleaning Kitchen Universe Seed
# Canonical Schema - Kitchen Automation Definition
# Authority: Canonical Schema Closure Specification + Yeshua/Chaldean/Kenosis Principles
# Version: 1.0.0

universe:
  id: self_clean_kitchen_universe
  seed_hash: null  # Computed on first generation
  
  expansion:
    # Fractal expansion levels: zone → device → task → microaction
    levels:
      - zone          # Kitchen zones (countertop, floor, appliances, sink, etc.)
      - device        # Cleaning devices (robotic arm, UV sterilizer, dispenser, etc.)
      - task          # Cleaning tasks (wipe, sanitize, polish, scrub, etc.)
      - microaction   # Atomic actions (dispense soap, rotate brush, move arm, etc.)
    
    # Deterministic generation ensures reproducibility
    deterministic: true
    
    # Content-addressed: node IDs derived from content
    content_addressed: true
  
  generator:
    # Generator implementation location
    implementation: generators/self_clean_kitchen_fractal_dataset.py
    version: 1
    
  verification:
    # Canonical manifest of all nodes
    manifest: out/self_clean_kitchen_manifest.jsonl
    
    # Merkle root for verification
    merkle_root: required

  # SAFETY CONSTRAINTS - Mandatory for all nodes
  safety:
    max_force_per_actuator: 50  # Newtons
    max_temperature: 85  # Celsius
    chemical_compatibility:
      - soap
      - detergent
      - ethanol
      - enzymes
      - bleach
      - vinegar
    fail_safe_modes:
      - stop_all
      - notify_operator
      - emergency_shutdown
      - isolate_zone

# MANDATORY INVARIANTS
# These must be enforced at all times

invariants:
  INV-KU-001:
    description: "Universe regenerates deterministically from identical seed"
    enforcement: "Generator must be deterministic with fixed seed"
    
  INV-KU-002:
    description: "Node IDs derived from seed + level + index"
    formula: "node_id = SHA256(seed || parent_node || level || index || expansion_config)"
    enforcement: "Node ID generation must use canonical serialization"
    
  INV-KU-003:
    description: "Manifest + Merkle root binds all nodes"
    enforcement: "All nodes must appear in manifest with valid Merkle verification"
    
  INV-KU-004:
    description: "Safety rules enforced in all nodes and CI"
    enforcement: "Every device/task must validate safety constraints"

  INV-DEV-001:
    description: "node_id deterministic from seed, level, index"
    enforcement: "Reproducible node ID generation"
    
  INV-DEV-002:
    description: "All sensors & actuators must match device capabilities"
    enforcement: "Device metadata must be consistent with physical capabilities"
    
  INV-DEV-003:
    description: "AI modules must reference valid simulation/planning nodes"
    enforcement: "AI references must be valid and verifiable"
    
  INV-DEV-004:
    description: "Node content hash must match manifest entry"
    enforcement: "Content integrity via cryptographic hashing"
    
  INV-DEV-005:
    description: "DAG acyclic"
    enforcement: "No cycles allowed in dependency graph"

  INV-TASK-001:
    description: "Node corresponds to valid device"
    enforcement: "Task must reference existing device node"
    
  INV-TASK-002:
    description: "Step node_ids must correspond to DAG nodes"
    enforcement: "All task steps must be valid microaction nodes"
    
  INV-TASK-003:
    description: "Safety constraints must match universe specification"
    enforcement: "Task safety limits cannot exceed universe safety limits"
    
  INV-TASK-004:
    description: "content_hash matches manifest entry"
    enforcement: "Task projection integrity via hashing"

# Sample universe configuration
sample_universe:
  # Fixed seed for reproducibility
  seed_value: 314159  # Pi-inspired seed for kitchen universe
  
  # Kitchen zones
  zones:
    - countertop
    - floor
    - appliances
    - sink
  
  # Devices per zone (different devices in each zone)
  devices_per_zone:
    countertop:
      - robotic_arm
      - spray_dispenser
      - uv_sterilizer
    floor:
      - robotic_vacuum
      - mop_bot
    appliances:
      - self_clean_oven
      - dishwasher_interface
    sink:
      - faucet_controller
      - drain_cleaner
  
  # Tasks per device type
  tasks_per_device:
    robotic_arm:
      - wipe_surface
      - apply_sanitizer
      - polish
    spray_dispenser:
      - dispense_soap
      - dispense_disinfectant
    uv_sterilizer:
      - sterilize_area
    robotic_vacuum:
      - vacuum_floor
      - detect_debris
    mop_bot:
      - mop_floor
      - scrub_stains
    self_clean_oven:
      - high_temp_clean
      - cool_down
    dishwasher_interface:
      - load_detergent
      - rinse_cycle
    faucet_controller:
      - hot_water_rinse
      - cold_water_rinse
    drain_cleaner:
      - enzyme_treatment
      - flush_pipes
  
  # Microactions per task (variable count)
  microactions_per_task:
    wipe_surface: 4
    apply_sanitizer: 3
    polish: 3
    dispense_soap: 2
    dispense_disinfectant: 2
    sterilize_area: 3
    vacuum_floor: 5
    detect_debris: 3
    mop_floor: 5
    scrub_stains: 4
    high_temp_clean: 3
    cool_down: 2
    load_detergent: 2
    rinse_cycle: 3
    hot_water_rinse: 2
    cold_water_rinse: 2
    enzyme_treatment: 3
    flush_pipes: 2

# Device capabilities metadata
device_capabilities:
  robotic_arm:
    sensors:
      vision: true
      proximity: true
      chemical: false
      temperature: true
    actuators:
      arm: true
      brush: true
      spray: false
      uv: false
    ai_module:
      planner: "trajectory_planner_v1"
      optimizer: "force_optimizer_v1"
      simulation_model: "kitchen_physics_sim_v1"
    physical_properties:
      weight_kg: 15.5
      dimensions_m: [0.8, 0.3, 0.4]  # x, y, z
      material: "stainless_steel"
      
  spray_dispenser:
    sensors:
      vision: false
      proximity: true
      chemical: true
      temperature: false
    actuators:
      arm: false
      brush: false
      spray: true
      uv: false
    ai_module:
      planner: "dispense_planner_v1"
      optimizer: "flow_optimizer_v1"
      simulation_model: "fluid_dynamics_sim_v1"
    physical_properties:
      weight_kg: 2.5
      dimensions_m: [0.15, 0.15, 0.25]
      material: "plastic_composite"
      
  uv_sterilizer:
    sensors:
      vision: false
      proximity: true
      chemical: false
      temperature: true
    actuators:
      arm: false
      brush: false
      spray: false
      uv: true
    ai_module:
      planner: "coverage_planner_v1"
      optimizer: "uv_dose_optimizer_v1"
      simulation_model: "uv_propagation_sim_v1"
    physical_properties:
      weight_kg: 3.2
      dimensions_m: [0.3, 0.3, 0.15]
      material: "uv_resistant_plastic"

