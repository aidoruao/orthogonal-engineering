\* Infeasible instance, paid-only model.
\*
\* Demand   = 3x50 + 3x40 = 270 minutes
\* Capacity = 60 x 4 days  = 240 minutes
\*
\* Expected: NotComplete is an INVARIANT. TLC explores every reachable state and
\* finds none in which every required occurrence has been performed, so no
\* interleaving of paid work completes the specification. That is a
\* schedule-level statement, not the inequality.
SPECIFICATION Spec
CONSTANT ServiceDays = 4
CONSTANT ShiftMinutes = 60
CONSTANT Cost1 = 50
CONSTANT Cost2 = 40
CONSTANT Required1 = 3
CONSTANT Required2 = 3
CONSTANT UnpaidAllowed = FALSE
INVARIANT NoUnpaidLabor
INVARIANT WithinPaidCapacity
INVARIANT NotComplete
CHECK_DEADLOCK FALSE
