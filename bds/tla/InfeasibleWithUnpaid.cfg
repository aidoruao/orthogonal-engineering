\* The same infeasible instance, with unpaid work permitted.
\*
\* Expected: NotComplete is VIOLATED. TLC finds a completion whose trace
\* contains unpaid minutes. The only difference from InfeasiblePaidOnly.cfg is
\* the boolean UnpaidAllowed, so the difference between the two runs IS the
\* dichotomy: unmet standards, or unpaid labour.
SPECIFICATION Spec
CONSTANT ServiceDays = 4
CONSTANT ShiftMinutes = 60
CONSTANT Cost1 = 50
CONSTANT Cost2 = 40
CONSTANT Required1 = 3
CONSTANT Required2 = 3
CONSTANT UnpaidAllowed = TRUE
INVARIANT NotComplete
CHECK_DEADLOCK FALSE
