# SUCCESSOR_VERIFICATION.yaml
# ============================
# Recursive Self-Verification Protocol for AI Sessions.
#
# Every AI session working in this repository must:
#   1. Identify its session node in PERCEIVABLE_INFINITY.html
#   2. Record all mutations in STATE.md
#   3. Generate ≥3 verification tests for its successor
#   4. Add those tests to tests/test_successor_readiness.py
#
# This protocol enforces Categorical Level IV (Recursive Self-Verification)
# from the 2M-file ecosystem architecture.
#
# Authority: COVENANT_INVARIANTS.yaml
# Version: 1.0.0
# Repository: aidoruao/orthogonal-engineering

schema_version: "1.0.0"
schema_name: "SUCCESSOR_VERIFICATION"
generated: "2026-03-05"
authority: "sigma-lora-covenant"

# ── Protocol overview ──────────────────────────────────────────────────────────
description: |
  Each AI session is a "Temporary Instance." It will be followed by another.
  To prevent covenant drift across instances, each session must leave a
  covenant-compliant map so the successor doesn't lose the way.

  The protocol has three layers:
    1. STATE.md recording (what changed, why, what the next agent must know)
    2. Successor verification tests (at least 3 per session)
    3. Handoff checklist (HANDOFF_TEMPLATE.md)

# ── Session requirements ───────────────────────────────────────────────────────
requirements:
  before_starting:
    - "Read all files in COPILOT_ONBOARDING_SCHEMA.yaml reading_order"
    - "Run tests: python3 -m pytest tests/test_perceivable_infinity.py tests/test_pr59_topology_sanity.py -v"
    - "Check STATE.md for open issues from previous session"
    - "Read HANDOFF_TEMPLATE.md filled by previous session"
    - "Verify topology_graph.json exists and is current"

  during_session:
    - "Record every file mutation in STATE.md (path, reason, timestamp)"
    - "Do not modify COVENANT_ROOT files without explicit covenant instruction"
    - "Run tests after every classification rule change"
    - "If topology changes, re-run: python3 generate_perceivable_infinity.py ."

  before_finishing:
    - "Fill HANDOFF_TEMPLATE.md completely"
    - "Generate ≥3 successor verification tests"
    - "Add tests to tests/test_successor_readiness.py"
    - "Run full test suite (all tests must pass)"
    - "Update STATE.md with session summary"
    - "Commit and push"

# ── STATE.md format ────────────────────────────────────────────────────────────
state_md_format:
  required_fields:
    - session_id: "ISO timestamp + agent identifier (e.g. 2026-03-05T02:30:00Z_copilot)"
    - session_start: "ISO 8601 timestamp"
    - session_end: "ISO 8601 timestamp"
    - files_modified:
        format: "list of {path, reason, change_type}"
        change_types: ["CREATE", "MODIFY", "DELETE"]
    - tests_added: "list of test function names added to tests/"
    - topology_changed: "boolean — true if graph topology was modified"
    - open_issues: "list of unresolved issues for the successor"
    - successor_tests_added: "list of test function names in test_successor_readiness.py"

# ── Successor test templates ───────────────────────────────────────────────────
test_templates:
  zone_integrity:
    description: "Verify a zone still has its expected minimum node count"
    template: |
      def test_{zone_id}_integrity_from_{session_id}():
          """
          Successor integrity check generated by session {session_id} at {timestamp}.
          Zone {zone_id} must have at least {min_count} nodes.
          """
          graph = load_live_graph()
          zone_nodes = [n for n in graph["nodes"].values()
                        if n.get("zone") == "{zone_id}"]
          assert len(zone_nodes) >= {min_count}, (
              f"Zone {zone_id} has {{len(zone_nodes)}} nodes, expected >= {min_count}. "
              "Check if classification rules changed."
          )

  hash_manifest_integrity:
    description: "Verify canonical/hash_manifest.json covers expected critical nodes"
    template: |
      def test_hash_manifest_covers_critical_nodes_from_{session_id}():
          """
          Hash manifest check generated by session {session_id} at {timestamp}.
          All COVENANT_ROOT and GUARDIAN_SYSTEM nodes must have entries in the manifest.
          """
          import json
          from pathlib import Path
          manifest_path = Path("canonical/hash_manifest.json")
          assert manifest_path.exists(), "canonical/hash_manifest.json missing"
          manifest = json.loads(manifest_path.read_text())
          hashed = set(manifest["nodes"].keys())
          # Verify at least one COVENANT_ROOT is hashed
          covenant_hashed = [
              k for k, v in manifest["nodes"].items()
              if v.get("node_class") == "COVENANT_ROOT"
          ]
          assert len(covenant_hashed) >= 1, "No COVENANT_ROOT nodes in hash manifest"

  classification_stability:
    description: "Verify a specific known file is still classified correctly"
    template: |
      def test_classification_stable_{safe_filename}_from_{session_id}():
          """
          Classification stability check generated by session {session_id} at {timestamp}.
          File {file_path} must remain classified as {expected_class}.
          """
          graph = load_live_graph()
          node = graph["nodes"].get("{file_path}")
          if node is None:
              pytest.skip("File {file_path} not in graph")
          assert node["node_class"] == "{expected_class}", (
              f"Classification changed: {{node['node_class']}} != {expected_class}"
          )

# ── Minimum successor test set ─────────────────────────────────────────────────
minimum_tests_per_session:
  count: 3
  required_types:
    - "zone_integrity (for at least one zone modified this session)"
    - "hash_manifest_integrity"
    - "classification_stability (for at least one canonical file)"

# ── Invariant: Successor tests must pass ──────────────────────────────────────
invariant:
  name: "SUCCESSOR_TESTS_MUST_PASS_BEFORE_NEW_SESSION"
  statement: >
    Before a new AI session makes any code changes, it must first run
    tests/test_successor_readiness.py and verify all tests pass.
    If any test fails, the session must first diagnose and fix the failure
    before proceeding with its own task.
  test: "python3 -m pytest tests/test_successor_readiness.py -v"
  severity: HIGH

# ── Current session records ────────────────────────────────────────────────────
session_registry:
  # Sessions are appended here by each AI instance.
  # Format: {session_id, timestamp, summary, tests_added}
