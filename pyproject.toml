[project]
name = "orthogonal_engineering"
version = "0.1.0"
description = "Deterministic institutional audit engine"
authors = [{name="Aidor"}]
dependencies = [
    "pydantic>=1.10",
    "pandas>=1.3",
    "sigma_lora_covenant"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["orthogonal_engineering*", "meta_engine*"]
