version: '3.8'

services:
  open_notebook:
    image: lfnovo/open_notebook:v1-latest-single
    container_name: orthogonal-open-notebook
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      # Mount repo as READ-ONLY to preserve integrity
      - ./:/app/data/repo:ro
      - ./notebook_data:/app/data
      - ./surreal_data:/mydata
    restart: unless-stopped

  # Optional: local Ollama for total privacy
  ollama:
    image: ollama/ollama:latest
    container_name: orthogonal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
