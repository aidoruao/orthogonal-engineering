# Seed Definition for 30M LOC (300 batches) — scale-run seed for lazy single-batch DAGs
# Version: 1.0.0
# Standard: Yeshua

# Root configuration
root:
  name: "orthogonal_engineering_30m"
  target_lines: 30000000
  batch_size: 100000  # 100K lines per batch
  batch_count: 300

# Fractal expansion rules - same geometry as the test seed
expansion:
  levels:
    # Level 0: Batch (300 batches for the scale run)
    - name: "batch"
      count: 300
      template: "batch_template.py"
      description: "Scale-run batches, each containing 100K lines"

    # Level 1: Module (10 modules per batch)
    - name: "module"
      count: 10
      template: "module_template.py"
      description: "Modules within batch"

    # Level 2: File (10 files per module)
    - name: "file"
      count: 10
      template: "file_template.py"
      description: "Individual Python files"

    # Level 3: Function (100 functions per file)
    - name: "function"
      count: 100
      template: "function_template.py"
      description: "Python functions (100 per file)"

    # Level 4: Line (10 lines per function)
    - name: "line"
      count: 10
      template: "line_template.py"
      description: "Individual lines of Python code (leaf nodes)"
      # 300 batches × 10 modules × 10 files × 100 functions × 10 lines = 30,000,000 lines ✓

# Same generation parameters as full version
generation:
  seed_value: 42
  templates_dir: "generators/templates/"
  naming_convention: "{level}_{index:06d}"
  encoding: "utf-8"
  line_ending: "LF"

# Same hashing configuration
hashing:
  algorithm: "sha256"
  leaf_prefix: "0x00"
  internal_prefix: "0x01"
  include_parent: true
  sort_children: true

# Metadata
metadata:
  author: "Orthogonal Engineering"
  standard: "Yeshua"
  created: "2026-08-05"
  version: "1.0.0-scale30m"
  license: "See repository LICENSE"
  description: "300-batch seed for the 1B-token scale run (lazy single-batch DAGs)"

# Validation constraints
validation:
  verify_math: true
  verify_acyclic: true
  verify_templates: true
  verify_naming: true

# Math verification:
# 300 batches × 10 modules × 10 files × 100 functions × 10 lines = 30,000,000 lines ✓
