# .github/workflows/pr40-canonical-presence.yml
# PR #40 — Canonical Presence / State Witness Layer
# Standard: Yeshua
# Version: 1.0.0
#
# On every push to main:
#   1. Compute a canonical feed entry from resilience/invariant_spec_v2.freeze
#   2. Append it to AGENT_FEED.md (idempotent: same commit is skipped)
#   3. Commit the updated AGENT_FEED.md back to the branch
#
# PYTHONHASHSEED is pinned to 40 for cross-run reproducibility.

name: State Witness Layer (PR #40)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "40"
  TZ: "UTC"
  SOURCE_DATE_EPOCH: "1700000000"

permissions:
  contents: write

# Serialize write-back runs so that concurrent pushes to main do not produce
# non-fast-forward rejections when the bot tries to push AGENT_FEED.md.
# cancel-in-progress: false ensures that every push gets a witness entry even
# when runs are queued (the waiting run will execute after the active one).
concurrency:
  group: state-witness-write
  cancel-in-progress: false

jobs:
  state-witness:
    name: State Witness (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full clone so that the write-back push is never rejected
          # as non-fast-forward when concurrent pushes arrive.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run PR #40 test suite
        run: |
          pytest tests/test_pr40_state_witness.py -v

      - name: Verify existing feed integrity
        run: |
          python tools/state_witness/generate_feed_entry.py --verify

      - name: Append feed entry (idempotent)
        if: github.event_name == 'push' && matrix.python-version == '3.11'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python tools/state_witness/generate_feed_entry.py

      - name: Commit updated AGENT_FEED.md
        if: github.event_name == 'push' && matrix.python-version == '3.11'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit if AGENT_FEED.md was actually changed
          if git diff --quiet AGENT_FEED.md; then
            echo "AGENT_FEED.md unchanged (idempotent run) — nothing to commit."
          else
            git add AGENT_FEED.md
            git commit -m "chore(pr40): append state witness entry [skip ci]"
            # Discard unstaged artifacts (pycache, test outputs) before rebasing
            git checkout -- . || true
            git clean -fd || true
            # Pull remote changes before pushing in case a concurrent run landed.
            git pull --rebase origin main
            git push
          fi

      - name: Assert row count increased
        if: github.event_name == 'push' && matrix.python-version == '3.11'
        run: |
          python - <<'PYEOF'
          import re, sys
          from pathlib import Path
          text = Path("AGENT_FEED.md").read_text(encoding="utf-8")
          data_rows = [
              l for l in text.splitlines()
              if l.strip().startswith("| ")
              and "timestamp" not in l
              and "---" not in l
          ]
          count = len(data_rows)
          print(f"AGENT_FEED.md row count: {count}")
          if count == 0:
              print("ERROR: AGENT_FEED.md has no data rows", file=sys.stderr)
              sys.exit(1)
          PYEOF

  verify-feed-integrity:
    name: Verify Feed Integrity
    runs-on: ubuntu-latest
    needs: [ state-witness ]
    if: always() && needs.state-witness.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # For push events github.ref_name is the branch name (e.g. "main").
          # For pull_request events github.ref_name is "<pr>/merge" (not a real branch),
          # so fall back to github.head_ref which is the PR head branch name.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify feed chain integrity
        run: |
          python tools/state_witness/generate_feed_entry.py --verify \
            2>/tmp/verify_stderr.txt; \
          VERIFY_EXIT=$?; \
          if [ $VERIFY_EXIT -ne 0 ]; then \
            python tools/state_witness/alert_on_failure.py \
              --exit-code $VERIFY_EXIT \
              --stderr-file /tmp/verify_stderr.txt \
              --alerts-file state_witness_alerts.jsonl; \
          fi; \
          exit $VERIFY_EXIT
