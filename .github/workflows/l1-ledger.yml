name: L1 Ledger Gate

# Structural gate for the claim ledger.
#
# Enforced on every push and PR that touches the ledger:
#   1. The TypeScript gate typechecks and its tests pass.
#   2. The Lean structural proofs compile.
#   3. Three negative controls are REJECTED. If any of them ever compiles, the
#      corresponding invariant is vacuous and this job fails.
#   4. No raw L0 docket material is tracked by git.
#   5. The selection ledger, if published, accounts for every candidate.
#
# The real-corpus quote tests skip on CI by design: CI does not hold the L0
# corpus, and it must not. Quote verification runs locally, before a claim is
# committed. See docs/DATA_ISOLATION_BOUNDARY.md.
#
# Consent: .github/workflows/** is a kernel surface. Consent entry
# codewhale-20261017-l1-ledger-gate is in the consent log.

on:
  push:
    branches: [main]
    paths:
      - "ledger/**"
      - "L1_LEDGER.lean"
      - "L1_SELECTION.lean"
      - "L1_GATES.lean"
      - ".github/workflows/l1-ledger.yml"
  pull_request:
    paths:
      - "ledger/**"
      - "L1_LEDGER.lean"
      - "L1_SELECTION.lean"
      - "L1_GATES.lean"
      - ".github/workflows/l1-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: "Ledger gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ledger/package-lock.json

      - name: Install dependencies
        working-directory: ledger
        run: npm ci

      - name: Typecheck
        working-directory: ledger
        run: npm run typecheck

      - name: Build and test
        working-directory: ledger
        run: |
          npm run build
          node --test dist/test/*.test.js

      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean structural proofs
        run: |
          lean L1_LEDGER.lean
          lean L1_SELECTION.lean
          lean L1_GATES.lean

      - name: Negative controls must be rejected
        run: |
          set -euo pipefail
          OLEAN_DIR="$(mktemp -d)"
          trap 'rm -rf "$OLEAN_DIR"' EXIT
          lean -o "$OLEAN_DIR/L1_LEDGER.olean" L1_LEDGER.lean
          lean -o "$OLEAN_DIR/L1_SELECTION.olean" L1_SELECTION.lean
          lean -o "$OLEAN_DIR/L1_GATES.olean" L1_GATES.lean
          for control in \
            ledger/negative/NEGATIVE_CONTROL.lean \
            ledger/negative/SELECTION_DROP.lean \
            ledger/negative/SELECTION_ANONYMOUS.lean \
            ledger/negative/GATES_THEATRE.lean \
            ledger/negative/GATES_DOMINANCE.lean
          do
            if LEAN_PATH="$OLEAN_DIR" lean "$control" >/dev/null 2>&1; then
              echo "FAIL: $control compiled. Its invariant is vacuous." >&2
              exit 1
            fi
            echo "OK: rejected $control"
          done

      - name: No raw L0 material tracked
        run: |
          set -euo pipefail
          tracked="$(git ls-files 'evidence/fleites/*.pdf' 'evidence/fleites/*.txt' 'evidence/fleites/*.csv' || true)"
          if [ -n "$tracked" ]; then
            echo "FAIL: raw L0 material is tracked by git:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          echo "OK: no raw L0 material tracked"

      - name: Standards compliance
        working-directory: ledger
        run: node dist/src/compliance.js --root "$GITHUB_WORKSPACE"

      - name: Selection ledger accounts for every candidate
        working-directory: ledger
        run: |
          set -euo pipefail
          if [ -f candidates.jsonl ] && [ -f selection.jsonl ]; then
            node dist/src/selection-check.js \
              --candidates candidates.jsonl --ledger selection.jsonl
          elif [ -f selection.jsonl ]; then
            echo "FAIL: selection.jsonl exists without candidates.jsonl" >&2
            exit 1
          else
            echo "SKIP: no selection ledger published yet"
          fi
