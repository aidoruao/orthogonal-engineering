name: Fraction Enforcement
on: [push, pull_request]
jobs:
  no-floats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for float violations in domains (invariants)
        run: |
          violations=$(grep -rn "float(\|isclose(" src/domains/*/invariants.py || true)
          if [ -n "$violations" ]; then
            echo "FLOAT VIOLATIONS FOUND:"
            echo "$violations"
            exit 1
          fi
          echo "No float violations found in invariants."
      - name: Check for float violations in domains (implementation)
        run: |
          violations=$(grep -rn "float(\|isclose(" src/domains/*/implementation.py || true)
          if [ -n "$violations" ]; then
            echo "FLOAT VIOLATIONS IN IMPLEMENTATION FILES:"
            echo "$violations"
            exit 1
          fi
          echo "No float violations found in implementation files."
      - name: Check for float violations in bar exam
        run: |
          violations=$(grep -rn "float(" pr50_bar_exam/ || true)
          if [ -n "$violations" ]; then
            echo "FLOAT VIOLATIONS IN BAR EXAM:"
            echo "$violations"
            exit 1
          fi
      - name: Verify falsifies_if coverage
        # Bug fix: use -iE with character class to match both:
        #   "Falsifies if:" (docstring format, space separator) and
        #   "falsifies_if:" / "falsifies_if=" (underscore formats).
        run: |
          total=$(find src/domains -maxdepth 2 -name "invariants.py" | wc -l)
          covered=$(grep -iErl "falsifies[_ ]if" src/domains/*/invariants.py | wc -l)
          echo "falsifies_if coverage: $covered / $total"
          if [ "$covered" -lt "$total" ]; then
            echo "FAIL: Not all domain invariants have falsifies_if"
            exit 1
          fi
          echo "PASS: All $total domains have falsifies_if coverage."
