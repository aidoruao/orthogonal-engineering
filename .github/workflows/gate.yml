name: Orthogonal Engineering - Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run automated test suite
      run: |
        python analysis/automated_test_suite.py universal_inventory.csv
    
    - name: Verify canal detector precision
      run: |
        python analysis/canal_detector_v1.py universal_inventory.csv --json test_results.json
        PRECISION=$(python -c "import json; data=json.load(open('test_results.json')); print(data.get('precision_ok', False))")
        if [ "$PRECISION" != "True" ]; then
          echo "❌ FAIL: Canal detector precision < 80%"
          exit 1
        fi
    
    - name: Run null hypothesis test
      run: |
        python -c "from analysis.canal_detector_v1 import gutenberg_null_test; assert gutenberg_null_test() < 0.05, 'Null hypothesis test failed'"
    
    - name: Archive test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test_results.json
          evidence/*.json
