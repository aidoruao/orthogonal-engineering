name: PR26 Cross-Platform Determinism

on:
  push:
    branches: [ main, copilot/remove-floating-arithmetic ]
    paths:
      - 'oe_ifm/**'
      - 'tests/test_pr26_cross_machine.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'oe_ifm/**'
      - 'tests/test_pr26_cross_machine.py'

jobs:
  test-determinism:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Prevent Git from converting line endings on Windows
          autocrlf: false
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch pyyaml safetensors numpy pytest
      
      - name: Display platform info
        run: |
          python -c "import sys, platform; print(f'Python: {sys.version}'); print(f'Platform: {platform.platform()}'); print(f'Machine: {platform.machine()}'); print(f'Endianness: {sys.byteorder}')"
          python -c "import torch; print(f'PyTorch: {torch.__version__}')"
      
      - name: Run determinism test
        run: |
          python tests/test_pr26_cross_machine.py
        env:
          # Ensure consistent behavior across platforms
          PYTHONHASHSEED: 0
      
      - name: Capture model hash
        id: hash
        run: |
          python -c "
          from pathlib import Path
          merkle_file = Path('merkle_roots/pr26_merkle_root.txt')
          if merkle_file.exists():
              hash_value = merkle_file.read_text().strip()
              print(f'hash={hash_value}')
              print(f'Model hash: {hash_value}')
          else:
              print('hash=MISSING')
          " >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Upload hash as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.os }}-python${{ matrix.python-version }}
          path: merkle_roots/pr26_merkle_root.txt
          if-no-files-found: error
  
  verify-cross-platform:
    name: Verify All Hashes Match
    runs-on: ubuntu-latest
    needs: test-determinism
    steps:
      - name: Download all hash artifacts
        uses: actions/download-artifact@v4
        with:
          path: hashes
      
      - name: Collect and compare hashes
        run: |
          echo "Collecting all hashes..."
          find hashes -name "pr26_merkle_root.txt" -exec cat {} \; | sort | uniq > unique_hashes.txt
          
          UNIQUE_COUNT=$(wc -l < unique_hashes.txt)
          
          echo "Unique hashes found: $UNIQUE_COUNT"
          cat unique_hashes.txt
          
          if [ "$UNIQUE_COUNT" -eq 1 ]; then
            echo "✓✓✓ SUCCESS: All platforms produced IDENTICAL model hash!"
            echo "✓ Cross-platform determinism VERIFIED"
            cat unique_hashes.txt
            exit 0
          else
            echo "✗✗✗ FAILURE: Multiple different hashes detected!"
            echo "✗ Cross-platform determinism FAILED"
            echo "Different hashes:"
            cat unique_hashes.txt
            exit 1
          fi
