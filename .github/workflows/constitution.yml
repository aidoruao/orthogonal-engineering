name: Constitution Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONIOENCODING: utf-8
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # constitution — run all axiomatic enforcement checks on ubuntu-latest
  # -------------------------------------------------------------------------
  constitution:
    name: Constitution (Ubuntu)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: I - Peano & Logic axiom tests
        run: python -m pytest tests/test_axioms.py -v

      - name: III - Popperian falsification tests
        run: python -m pytest tests/test_falsification_layer.py -v

      - name: VI - Ownership guard (free forever check)
        run: python ownership_guard.py

      - name: VIII - Yeshua enforcement
        run: python -m pytest tests/test_yeshua_enforcement.py -v

      - name: IX - Benchmark suite
        continue-on-error: true
        run: python benchmarks/run_benchmarks.py

      - name: V - Global Merkle root tests
        run: python -m pytest tests/test_global_merkle.py -v

      - name: Upload global Merkle root artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-merkle-root-py${{ matrix.python-version }}
          path: merkle/global_root.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # compare-roots — assert all artifacts have identical root_hash
  # -------------------------------------------------------------------------
  compare-roots:
    name: Compare Global Merkle Roots
    needs: constitution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all Merkle root artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: global-merkle-root-*
          path: /tmp/merkle_roots

      - name: Assert all roots are identical
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          root_files = list(pathlib.Path("/tmp/merkle_roots").rglob("global_root.json"))
          if not root_files:
              print("ERROR: No global_root.json artifacts found")
              sys.exit(1)

          roots = set()
          for f in root_files:
              data = json.loads(f.read_text())
              roots.add(data["root_hash"])
              print(f"  {f.parent.name}: {data['root_hash']}")

          if len(roots) != 1:
              print(f"FAIL: {len(roots)} distinct roots
